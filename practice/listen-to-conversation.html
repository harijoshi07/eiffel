<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TOEFL Listening — Listen to a Conversation</title>
<style>
:root{--bg:#f7f2ea;--card:#fffdf9;--ink:#2d2a26;--muted:#8a8178;--line:#e6ddd0;--terra:#c46a4a;--terra-soft:#f3e0d6;--sage:#7d9a7e;--sage-soft:#e2ebe2;--red:#b5483a;--red-soft:#f6dcd7;--amber-soft:#f8ecd0;--amber:#8a6a1d}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.6}
.wrap{display:grid;grid-template-columns:270px 1fr;min-height:100vh}
aside{background:var(--card);border-right:1px solid var(--line);padding:24px 18px;position:sticky;top:0;height:100vh;overflow:auto}
h1{font-size:18px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px}
.group{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 0 6px}
.mod{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:0;padding:8px 10px;border-radius:10px;cursor:pointer;color:var(--ink);font:inherit;text-align:left}
.mod:hover{background:var(--bg)}.mod.active{background:var(--terra-soft)}
.badge{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--line);color:var(--muted)}
.badge.done{background:var(--sage-soft);color:#3f6143}
.totals{margin-top:22px;font-size:13px;color:var(--muted)}
main{padding:28px 36px;max-width:860px;width:100%}
.bar{position:sticky;top:0;z-index:5;background:rgba(247,242,234,.94);backdrop-filter:blur(6px);display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--line);margin-bottom:22px}
.bar .title{font-weight:600;margin-right:auto;font-size:15px}
.timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;min-width:56px}
button,select{font:inherit}
button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 14px;border-radius:999px;cursor:pointer}
button.primary{background:var(--terra);border-color:var(--terra);color:#fff}
button:disabled{opacity:.45;cursor:not-allowed}
button:hover:not(:disabled){filter:brightness(.97)}
.bar select{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px 30px;margin-bottom:16px}
.card h2{margin:0 0 10px;font-size:20px}
.muted{color:var(--muted)}
.prog{display:flex;gap:6px;margin-bottom:18px}
.dot{flex:1;height:6px;border-radius:3px;background:var(--line)}
.dot.on{background:var(--terra)}.dot.ok{background:var(--sage)}.dot.bad{background:var(--red)}.dot.skip{background:#cbbf9e}
.listen{display:flex;align-items:center;gap:14px;padding:18px 20px;border-radius:14px;background:var(--terra-soft);margin-bottom:18px}
.listen .ico{font-size:26px}
.listen.err{background:var(--red-soft);color:var(--red)}
.listen.done{background:var(--sage-soft)}
.opt{display:flex;gap:12px;align-items:flex-start;padding:11px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:9px;cursor:pointer;background:#fff}
.opt input{margin-top:6px}
.opt .l{font-weight:600;color:var(--terra);min-width:18px}
.opt.sel{border-color:var(--terra);background:var(--terra-soft)}
.opt.right{border-color:var(--sage);background:var(--sage-soft)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt.static{cursor:default}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.qhead{display:flex;gap:10px;align-items:center;margin-bottom:8px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.qnum{font-weight:600;color:var(--terra)}
.tag{font-size:12px;padding:1px 9px;border-radius:999px}
.tag.ok{background:var(--sage-soft);color:#3f6143}.tag.bad{background:var(--red-soft);color:var(--red)}.tag.type{background:var(--line);color:var(--muted)}.tag.skip{background:var(--amber-soft);color:var(--amber)}
.stem{font-weight:500;margin:4px 0 12px}
.warn{background:var(--amber-soft);color:var(--amber);border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:12px}
.turns{margin:10px 0 0}
.turn{display:flex;gap:10px;margin-bottom:6px}
.turn b{min-width:58px;color:var(--terra);font-weight:600}
.fb{margin-top:10px;font-size:14px;border-top:1px dashed var(--line);padding-top:10px}
.fb select,.fb textarea{width:100%;margin-top:6px;font:inherit;border:1px solid var(--line);border-radius:10px;padding:8px;background:#fff}
.fb textarea{min-height:56px}
.hint{font-size:12.5px;color:var(--muted);margin:6px 0 2px;line-height:1.4}
.exportbox textarea{width:100%;min-height:260px;font:13px ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}
.score{font-size:34px;font-weight:700;color:var(--terra);line-height:1.1}
.note{font-size:12px;color:var(--muted);margin-top:18px}
@media(max-width:900px){.wrap{grid-template-columns:1fr}aside{position:static;height:auto}main{padding:18px}}
</style></head>
<body><div class="wrap">
<aside>
  <h1>Listen to a Conversation</h1>
  <div class="sub">21 conversations · 42 questions</div>
  <div id="nav"></div>
  <div class="totals" id="totals"></div>
  <div class="note">Audio plays from <code>../resources/audio</code>, so this page works only on this computer, in a browser that plays Ogg Vorbis (Arc and Chrome do; Safari does not).</div>
</aside>
<main>
  <div class="bar">
    <div class="title" id="title"></div>

    </select>
    <button id="resetBtn">Reset</button>
    <button id="exportBtn">Export log</button>

  <div id="view"></div>
  <div class="exportbox" id="exportbox" hidden>
    <h2 style="font-size:16px">Markdown log</h2>
    <textarea id="exportText" readonly></textarea>
    <div class="row" style="margin-top:8px"><button id="copyBtn">Copy</button><span class="muted" id="copied"></span></div>
  </div>
</main></div>
<script>
const DATA = [{"id": "T1_1_9", "test": 1, "src": "Full-Length 1", "module": 1, "range": "9-10", "audio": "../resources/audio/tests/student-1/listening/conversations/Listening1_Conversation_Questions9-10.ogg", "questions": [{"n": 9, "question": "What does the woman imply that she was about to do?", "options": {"A": "See a play", "B": "Change her clothes", "C": "Go shopping", "D": "Eat dinner"}, "key": "C"}, {"n": 10, "question": "Why does the man say “I’d forget my head if it wasn’t screwed on”?", "options": {"A": "He forgot what the woman wanted him to buy.", "B": "He forgot about the timing of their plans.", "C": "He forgot what they were going to eat for dinner.", "D": "He forgot to buy salmon and salad at the supermarket."}, "key": "B"}], "turns": [["Woman", "Need anything from the supermarket?"], ["Man", "Huh? Aren’t we getting ready to go see that play in a few minutes?"], ["Woman", "That’s tomorrow."], ["Man", "Oh. Wow, I’d forget my head if it wasn’t screwed on.... Guess I don’t need to change my clothes after all."], ["Woman", "So, you weren’t planning to prepare dinner?"], ["Man", "No, but I can. What do you want?"], ["Woman", "Just something light and healthy. So, can you go shopping instead?"], ["Man", "Yeah, sure. How about salmon and salad? Want anything else?"], ["Woman", "No, that’s good. Thanks!"]]}, {"id": "T1_1_11", "test": 1, "src": "Full-Length 1", "module": 1, "range": "11-12", "audio": "../resources/audio/tests/student-1/listening/conversations/Listening1_Conversation_Questions11-12.ogg", "questions": [{"n": 11, "question": "Why did the woman call a technician?", "options": {"A": "An air-conditioner is leaking.", "B": "A room is too hot.", "C": "An elevator needs maintenance.", "D": "A window will not open."}, "key": "B"}, {"n": 12, "question": "What does the woman suggest the man do?", "options": {"A": "Finish an assignment early", "B": "Wait for a service agent", "C": "Open a door", "D": "Take a break early"}, "key": "D"}], "turns": [["Man", "Did you see the maintenance request about the air-conditioning?"], ["Woman", "Yes, I called the technician this morning. They said someone should be here shortly."], ["Man", "That’s a relief. It’s getting uncomfortably warm in here."], ["Woman", "I know—I called as soon as I noticed. Hopefully, it’s just a minor issue and they can get it working again without too much delay. In the meantime, why don’t you go out to lunch early? Maybe it’ll be better when you get back."]]}, {"id": "T1_2_9", "test": 1, "src": "Full-Length 1", "module": 2, "range": "9-10", "audio": "../resources/audio/tests/student-1/listening/conversations/Listening2_Conversations_Questions9-10.ogg", "questions": [{"n": 9, "question": "What is the man trying to decide between?", "options": {"A": "A laptop and a smartphone", "B": "A smartphone and a tablet", "C": "A tablet and a desktop computer", "D": "A smartphone and a smartwatch"}, "key": "B"}, {"n": 10, "question": "What reason does the woman give for her suggestion?", "options": {"A": "The device is cheaper.", "B": "The device is easier to use on the go.", "C": "The device has a larger screen.", "D": "The device has better battery life."}, "key": "B"}], "turns": [["Man", "I’m trying to decide whether to get a smartphone or a tablet. What do you think?"], ["Woman", "It depends on what you need it for. If you want something portable and easy to use on the go, a smartphone is better."], ["Man", "That’s true. But I like the larger screen on a tablet for watching videos and reading."], ["Woman", "In that case...."], ["Man", "I better think about it some more."]]}, {"id": "T2_1_9", "test": 2, "src": "Full-Length 2", "module": 1, "range": "9-10", "audio": "../resources/audio/tests/student-2/listening/conversations/Listening1_Conversations_Questions9-10.ogg", "questions": [{"n": 9, "question": "What problem is the man experiencing with his laptop?", "options": {"A": "It has a cracked screen.", "B": "It won’t turn on.", "C": "It keeps freezing and shutting down.", "D": "It is running slowly."}, "key": "C"}, {"n": 10, "question": "What will the man most likely do next?", "options": {"A": "Buy a new laptop", "B": "Run another virus scan", "C": "Take his laptop to a repair shop", "D": "Restart his laptop"}, "key": "C"}], "turns": [["Man", "I think my laptop is acting up again. It keeps freezing and shutting down randomly."], ["Woman", "That’s frustrating. Have you tried restarting it or running a virus scan?"], ["Man", "Yes, I did both, but it didn’t help. I might need to take it to a repair shop."], ["Woman", "That sounds like a good idea. They should be able to diagnose and fix the issue."], ["Man", "I’ll do that this afternoon."]]}, {"id": "T2_1_11", "test": 2, "src": "Full-Length 2", "module": 1, "range": "11-12", "audio": "../resources/audio/tests/student-2/listening/conversations/Listening1_Conversations_Questions11-12.ogg", "questions": [{"n": 11, "question": "What is the man’s problem?", "options": {"A": "He has nothing to eat for lunch.", "B": "He is unable to attend a meeting.", "C": "He forgot about an obligation at work.", "D": "He needs more resources to finish a project."}, "key": "C"}, {"n": 12, "question": "What does the woman imply when she says, “I stocked up yesterday”?", "options": {"A": "She does not plan to go to work tomorrow.", "B": "She will provide the man with drinks for his meeting.", "C": "The supermarket has plenty of drinks available.", "D": "The man will not need extra time to finish his project."}, "key": "B"}], "turns": [["Man", "Are you going to the supermarket today by any chance?"], ["Woman", "I was just there yesterday. Why?"], ["Man", "I suddenly remembered that I’m supposed to bring some drinks to my team’s lunch meeting tomorrow at work, and I’m in the middle of a project I need to finish tonight."], ["Woman", "You’re in luck. I stocked up yesterday."]]}, {"id": "T2_2_9", "test": 2, "src": "Full-Length 2", "module": 2, "range": "9-10", "audio": "../resources/audio/tests/student-2/listening/conversations/Listening2_Conversations_Questions9-10.ogg", "questions": [{"n": 9, "question": "What was the woman not aware of?", "options": {"A": "The library’s new location", "B": "The library’s borrowing policy", "C": "The library’s holiday schedule", "D": "The library’s hours of operation"}, "key": "B"}, {"n": 10, "question": "What will the woman probably do next?", "options": {"A": "Return books to the library", "B": "Make a phone call to the library", "C": "Pay a fine for returning books late", "D": "Borrow a new book from the library"}, "key": "A"}], "turns": [["Man", "Have you returned the books we borrowed from the library?"], ["Woman", "Why? I thought we could keep them for six weeks."], ["Man", "Actually, it’s now four weeks. They changed the policy. I guess I forgot to tell you!"], ["Woman", "That means they’re due tomorrow!"], ["Man", "Exactly!"], ["Woman", "In that case, I’ll take care of it right now!"]]}, {"id": "T3_1_9", "test": 3, "src": "Teacher Resources 1", "module": 1, "range": "9-10", "audio": "../resources/audio/tests/teacher-1/listening/short-conversation/Listening1_Conversation_Questions_9-10.mp3", "questions": [{"n": 9, "question": "What kind of job does the man most likely have?", "options": {"A": "Fitness instructor", "B": "Driver", "C": "Office worker", "D": "Equipment manufacturer"}, "key": "C"}, {"n": 10, "question": "What does the man indicate about weekends?", "options": {"A": "He sometimes needs to go to work on weekends.", "B": "He sometimes repairs equipment in his house on weekends.", "C": "He likes to exercise outdoors on weekends.", "D": "He exercises more on weekends than on other days."}, "key": "D"}], "turns": [["Woman", "Have you decided which gym to join?"], ["Man", "I'm torn between the Nano Fitness Gym near my house and the Downtown Trainers gym near my work."], ["Woman", "The second one might suit you. You'll enjoy working up some sweat right after sitting at your desk in front of the computer all day, five days a week."], ["Man", "True. And Downtown Trainers has the better instructors and nicer equipment, too. But weekends is actually when I do most of my working out, and it’d be easier to do it near home than drive downtown."]]}, {"id": "T3_1_11", "test": 3, "src": "Teacher Resources 1", "module": 1, "range": "11-12", "audio": "../resources/audio/tests/teacher-1/listening/short-conversation/Listening1_Conversation_Questions_11-12.mp3", "questions": [{"n": 11, "question": "Why does the woman need professional help?", "options": {"A": "Her computer is not working properly.", "B": "She needs to choose a new computer.", "C": "She needs new software on her computer.", "D": "She has lost access to her email."}, "key": "A"}, {"n": 12, "question": "What will the man do after the meeting?", "options": {"A": "Offer the woman some advice", "B": "Call a downtown shop", "C": "Get his computer fixed", "D": "Share some contact information"}, "key": "D"}], "turns": [["Man", "Did you manage to fix your computer?"], ["Woman", "No, it's still acting up. I think I need professional help."], ["Man", "I know a great repair shop downtown. They fixed mine really quickly last month."], ["Woman", "Could you send me their contact information?"], ["Man", "Sure, I'll email it to you right after this meeting."]]}, {"id": "T3_2_9", "test": 3, "src": "Teacher Resources 1", "module": 2, "range": "9-10", "audio": "../resources/audio/tests/teacher-1/listening/short-conversation/Listening2_Conversation_Question_9-10.mp3", "questions": [{"n": 9, "question": "What does the woman offer to help with?", "options": {"A": "Deciding which products to sell", "B": "Finding new clients", "C": "Producing goods", "D": "Describing items for sale"}, "key": "D"}, {"n": 10, "question": "Why does the woman mention a client?", "options": {"A": "To emphasize the need for an online store", "B": "To propose a strategy for increasing sales", "C": "To illustrate the importance of collaboration", "D": "To explain why she prefers not to plan a meeting after lunch"}, "key": "D"}], "turns": [["Woman", "Did you finish setting up the new online store?"], ["Man", "Almost. There's just a few more product descriptions to write."], ["Woman", "Do you need any help with that? I know the stuff we sell pretty intimately."], ["Man", "Thank you! I'd love to collaborate with you on this. Would you like to meet in my office after lunch?"], ["Woman", "Later in the afternoon would be safer. I have a lunch-time meeting with our newest client today, and I don't know how long that's gonna last."]]}, {"id": "T4_1_9", "test": 4, "src": "Teacher Resources 2", "module": 1, "range": "9-10", "audio": "../resources/audio/tests/teacher-2/listening/short-conversation/Listening1_Conversation_Questions_9-10.mp3", "questions": [{"n": 9, "question": "What do the speakers dislike about the farmers market?", "options": {"A": "Its location is inconvenient.", "B": "Its supply of vegetables is limited.", "C": "It is often closed on Saturdays.", "D": "It can be expensive."}, "key": "A"}, {"n": 10, "question": "Why does the woman mention a wedding?", "options": {"A": "To make a point about rideshare prices", "B": "To explain why she needs to buy vegetables", "C": "To invite the man to an event", "D": "To identify a problem with the man's plan"}, "key": "D"}], "turns": [["Man", "Going to the farmers market on Saturday?"], ["Woman", "Yes, I need to pick up some fresh vegetables."], ["Man", "Me too. I love the produce there. I wish it were closer to downtown though."], ["Woman", "Yeah, changing two bus lines is a bit much."], ["Man", "Maybe let's try to recruit Michael and Sarah to come with us. Taking a rideshare wouldn't be so expensive if we split the fare among the four of us."], ["Woman", "That's a thought. Though I'm pretty sure the two of them are going to a wedding this Saturday."]]}, {"id": "T4_1_11", "test": 4, "src": "Teacher Resources 2", "module": 1, "range": "11-12", "audio": "../resources/audio/tests/teacher-2/listening/short-conversation/Listening1_Conversation_Questions_11-12.mp3", "questions": [{"n": 11, "question": "What do the speakers imply about the book that will be discussed tonight?", "options": {"A": "It provides diverse perspectives.", "B": "It is less philosophical than its author's other books.", "C": "It is very popular among book club members.", "D": "It is difficult to understand."}, "key": "D"}, {"n": 12, "question": "What does the man say about Chen Wang's poems?", "options": {"A": "They are similar to novels in some ways.", "B": "They lack philosophical insights.", "C": "He could read them more quickly after a book club discussion.", "D": "A book of them took him a week to read."}, "key": "C"}], "turns": [["Man", "Are you going to the book club meeting tonight?"], ["Woman", "I haven't finished the book yet."], ["Man", "That's OK! And yeah, Jake Homgren's novels can be a slog sometimes. But the philosophical insights in them are fascinating."], ["Woman", "Maybe if I hear other club members’ perspectives, it'll help me follow the book better and make the reading go faster."], ["Man", "This was exactly my experience when we discussed Chen Wang's poems last week."]]}, {"id": "T4_2_9", "test": 4, "src": "Teacher Resources 2", "module": 2, "range": "9-10", "audio": "../resources/audio/tests/teacher-2/listening/short-conversation/Listening2_Conversation_Questions_9-10.mp3", "questions": [{"n": 9, "question": "What problem are the speakers discussing?", "options": {"A": "A computer file is not opening.", "B": "A piece of equipment is not working.", "C": "A presentation time has been changed.", "D": "Some slides are not displaying properly."}, "key": "B"}, {"n": 10, "question": "What does the woman offer to do?", "options": {"A": "Attempt to repair a printer", "B": "Review the man's handouts", "C": "Help the man practice a presentation", "D": "Make copies of the man's presentation"}, "key": "A"}], "turns": [["Woman", "How are preparations for tomorrow’s meeting wit   let o = `# Listening Type B — Listen to a Conversation (exported ${new Date().toISOString().slice(0, 16).replace('T', ' ')})\n\nTotal: ${tot}/${den} across ${dc.length}/21 conversations · mode at export: ${S.mode}\n\n| Conversation | Source | Score | Time | Avg decision | Replays |\n|---|---|---|---|---|---|\n`;
  dc.forEach(c => { const s = S.mods[c.id]; const avg = s.ms.reduce((a, b) => a + b, 0) / s.ms.length / 1000;
    o += `| T${c.test} ${label(c)} | ${c.src} | ${score(c.id)}/${scored(c)}${scored(c) < c.questions.length ? ' (1 not scored)' : ''} | ${fmt(s.secs)} | ${avg.toFixed(1)}s | ${(s.replays || []).reduce((a, b) => a + (b || 0), 0)} |\n`; });
  let any = false, rows = '';
  dc.forEach(c => { const s = S.mods[c.id]; c.questions.forEach((q, i) => { if (!q.flag && s.ans[i] !== q.key) { any = true;
    rows += `| T${c.test} M${c.module} Q${q.n} | ${pipe(q.question)} | ${pipe(qtype(q.question))} | ${s.ans[i]}. ${pipe(q.options[s.ans[i]])} | ${q.key}. ${pipe(q.options[q.key])} | ${pipe(s.cause[i] || '')} | ${pipe(s.note[i] || '')} |\n`; } }); });
  o += any ? `\n## Misses\n\n| Item | Question | Type (auto) | My answer | Key | Cause | Note |\n|---|---|---|---|---|---|---|\n${rows}` : '\nNo misses recorded.\n';
  $('#exportText').value = o; $('#exportbox').hidden = false; $('#exportText').scrollIntoView({behavior: 'smooth'});
}

$('#mode').onchange = e => { S.mode = e.target.value; save(); if (view === 'run') { stopAudio(); run = {ans: [], ms: [], replays: [0, 0]}; qi = 0; runStart = Date.now(); renderRun(); } else render(); };
$('#resetBtn').onclick = () => { if (confirm('Reset this conversation? Your answers and notes for it will be deleted.')) { stopAudio(); clearInterval(tick); delete S.mods[cur]; save(); run = null; view = 'intro'; render(); } };
$('#exportBtn').onclick = exportMd;
$('#copyBtn').onclick = () => { $('#exportText').select(); document.execCommand('copy'); $('#copied').textContent = 'Copied'; setTimeout(() => $('#copied').textContent = '', 1500); };
document.addEventListener('keydown', e => {
  if (view !== 'run' || /TEXTAREA|SELECT/.test(e.target.tagName) || !$('#opts')) return;
  const k = e.key.toUpperCase();
  if (k.length === 1 && 'ABCD'.includes(k)) { const r = document.querySelector(`input[value=${k}]`); if (r) { r.checked = true; r.onchange(); } }
  else if (e.key === 'Enter' && $('#nextBtn') && !$('#nextBtn').disabled) next();
});
open(cur);
</script></body></html>
