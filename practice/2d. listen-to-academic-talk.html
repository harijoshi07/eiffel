<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TOEFL Listening — Listen to an Academic Talk</title>
<style>
:root{--bg:#f7f2ea;--card:#fffdf9;--ink:#2d2a26;--muted:#8a8178;--line:#e6ddd0;--terra:#c46a4a;--terra-soft:#f3e0d6;--sage:#7d9a7e;--sage-soft:#e2ebe2;--red:#b5483a;--red-soft:#f6dcd7;--amber-soft:#f8ecd0;--amber:#8a6a1d}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.6}
.wrap{display:grid;grid-template-columns:270px 1fr;min-height:100vh}
aside{background:var(--card);border-right:1px solid var(--line);padding:24px 18px;position:sticky;top:0;height:100vh;overflow:auto}
h1{font-size:18px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px}
.group{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 0 6px}
.mod{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:0;padding:8px 10px;border-radius:10px;cursor:pointer;color:var(--ink);font:inherit;text-align:left}
.mod:hover{background:var(--bg)}.mod.active{background:var(--terra-soft)}
.badge{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--line);color:var(--muted)}
.badge.done{background:var(--sage-soft);color:#3f6143}
.totals{margin-top:22px;font-size:13px;color:var(--muted)}
main{padding:28px 36px;max-width:860px;width:100%}
.bar{position:sticky;top:0;z-index:5;background:rgba(247,242,234,.94);backdrop-filter:blur(6px);display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--line);margin-bottom:22px}
.bar .title{font-weight:600;margin-right:auto;font-size:15px}
.timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;min-width:56px}
button,select{font:inherit}
button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 14px;border-radius:999px;cursor:pointer}
button.primary{background:var(--terra);border-color:var(--terra);color:#fff}
button:disabled{opacity:.45;cursor:not-allowed}
button:hover:not(:disabled){filter:brightness(.97)}
.bar select{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px 30px;margin-bottom:16px}
.card h2{margin:0 0 10px;font-size:20px}
.muted{color:var(--muted)}
.prog{display:flex;gap:6px;margin-bottom:18px}
.dot{flex:1;height:6px;border-radius:3px;background:var(--line)}
.dot.on{background:var(--terra)}.dot.ok{background:var(--sage)}.dot.bad{background:var(--red)}.dot.skip{background:#cbbf9e}
.listen{display:flex;align-items:center;gap:14px;padding:18px 20px;border-radius:14px;background:var(--terra-soft);margin-bottom:18px}
.listen .ico{font-size:26px}
.listen.err{background:var(--red-soft);color:var(--red)}
.listen.done{background:var(--sage-soft)}
.opt{display:flex;gap:12px;align-items:flex-start;padding:11px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:9px;cursor:pointer;background:#fff}
.opt input{margin-top:6px}
.opt .l{font-weight:600;color:var(--terra);min-width:18px}
.opt.sel{border-color:var(--terra);background:var(--terra-soft)}
.opt.right{border-color:var(--sage);background:var(--sage-soft)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt.static{cursor:default}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.qhead{display:flex;gap:10px;align-items:center;margin-bottom:8px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.qnum{font-weight:600;color:var(--terra)}
.tag{font-size:12px;padding:1px 9px;border-radius:999px}
.tag.ok{background:var(--sage-soft);color:#3f6143}.tag.bad{background:var(--red-soft);color:var(--red)}.tag.type{background:var(--line);color:var(--muted)}.tag.skip{background:var(--amber-soft);color:var(--amber)}
.stem{font-weight:500;margin:4px 0 12px}
.warn{background:var(--amber-soft);color:var(--amber);border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:12px}
.turns{margin:10px 0 0}
.turn{display:flex;gap:10px;margin-bottom:6px}
.turn b{min-width:58px;color:var(--terra);font-weight:600}
.fb{margin-top:10px;font-size:14px;border-top:1px dashed var(--line);padding-top:10px}
.fb select,.fb textarea{width:100%;margin-top:6px;font:inherit;border:1px solid var(--line);border-radius:10px;padding:8px;background:#fff}
.fb textarea{min-height:56px}
.hint{font-size:12.5px;color:var(--muted);margin:6px 0 2px;line-height:1.4}
.exportbox textarea{width:100%;min-height:260px;font:13px ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}
.score{font-size:34px;font-weight:700;color:var(--terra);line-height:1.1}
.note{font-size:12px;color:var(--muted);margin-top:18px}
@media(max-width:900px){.wrap{grid-template-columns:1fr}aside{position:static;height:auto}main{padding:18px}}
</style></head>

  </div>
</main></div>
<script>
const DATA = [{"id": "T1_1_15", "test": 1, "src": "Full-Length 1", "module": 1, "range": "15-18", "setting": "on a podcast about psychology", "audio": "../resources/audio/tests/student-1/listening/academic-talks/Listening1_Academic Talks_Questions15-18.ogg", "questions": [{"n": 15, "question": "What is the topic of the talk?", "options": {"A": "How psychologists study attention", "B": "How to keep the mind focused", "C": "Two types of fascination", "D": "The benefits of hard fascination"}, "key": "C"}, {"n": 16, "question": "Why does the speaker mention a movie?", "options": {"A": "To compare different types of movies", "B": "To introduce a concept in psychology", "C": "To explain how movies affect emotions", "D": "To encourage listeners to watch more movies"}, "key": "B"}, {"n": 17, "question": "What does the speaker say about her walk in the park?", "options": {"A": "It is similar to her experience watching a good movie.", "B": "Her mind has space for thoughts unrelated to nature.", "C": "She needs to put in special effort to stay focused on flowers and trees.", "D": "She gets mental fatigue from her mind engaging in hard fascination."}, "key": "B"}, {"n": 18, "question": "What does the speaker say about Default Mode Network?", "options": {"A": "It is involved in soft fascination.", "B": "It leads to irritability and stress.", "C": "It is easily tired from overuse.", "D": "Its effect is unknown to psychologists."}, "key": "A"}], "turns": [["Podcast Host", "Did you see that new thriller movie that came out last week? I did and loved it. The action, the plot twists… I was totally captivated. Time just flew by. Not a single thought occurred to me that was unrelated to the movie. What I experienced is what psychologists call hard fascination. Hard fascination means intense focus and concentration. Whether it’s TV programs, video games... hard fascination is all too easy to come by in this modern world. There’s another type of fascination—soft fascination. There’s still effortless attention, meaning that no special effort is required for you to stay focused, but there’s still room for other thoughts. When I take a walk in the park and look at the flowers and trees, for example, I might be thinking in the back of my mind about my dinner plans. Now, one thing to know is hard fascination causes mental fatigue. The mind is so intensely focused that it gets tired fast. What follows mental fatigue? You might find yourself easily distracted, irritable, and stressed. Soft fascination, in contrast, engages a different part of the brain—the DMN, or Default Mode Network, which soothes the mind and helps combat mental fatigue. So next time you feel like your mind is on overload, turn off the TV, put down your phone. Take a walk, or simply sit and stare at the clouds."]]}, {"id": "T1_2_13", "test": 1, "src": "Full-Length 1", "module": 2, "range": "13-16", "setting": "in an environmental science class", "audio": "../resources/audio/tests/student-1/listening/academic-talks/Listening2_Academic Talks_Questions13-16.ogg", "questions": [{"n": 13, "question": "What is the main topic of the talk?", "options": {"A": "Changes in consumption in societies over time", "B": "A measure of environmental impact", "C": "Environmentally damaging activities", "D": "The role of governments in sustainability"}, "key": "B"}, {"n": 14, "question": "Why does the speaker mention developed and developing countries?", "options": {"A": "To contradict a theory related to the ecological footprint", "B": "To show that resource depletion can be similar regardless of lifestyle", "C": "To illustrate the usefulness of comparing ecological footprints", "D": "To point out that production efficiency reduces the ecological footprint"}, "key": "C"}, {"n": 15, "question": "What does the speaker mention as a way that people can reduce their ecological footprint?", "options": {"A": "By disposing of waste appropriately", "B": "By joining an environmental organization", "C": "By using environmentally friendly forms of transportation", "D": "By eating locally produced food"}, "key": "D"}, {"n": 16, "question": "What will the speaker most likely discuss next?", "options": {"A": "How information about ecological footprints has been used in creating policies", "B": "How data about ecological footprints has been collected", "C": "Why the idea of ecological footprint is often misunderstood", "D": "Why sustainable development can be difficult to achieve"}, "key": "A"}], "turns": [["Professor", "An ecological footprint is a measure of the environmental impact of an individual, community, or country. It calculates the amount of natural resources consumed and the waste generated by human activities, usually expressed in global hectares. By comparing ecological footprints, we can understand how different lifestyles and practices contribute to resource depletion and environmental degradation. For instance, the ecological footprint of someone living in a developed country is typically larger than that of someone living in a developing country, mainly due to higher consumption levels and waste production. Factors such as energy use, transportation, food consumption, and housing play significant roles in determining the size of an ecological footprint. Understanding ecological footprints is crucial for promoting sustainability. It helps identify areas where changes can be made to reduce environmental impact. For example, if you consume locally produced foods, you'll likely reduce your ecological footprint because less energy will be used for transporting that food. Governments and organizations can use ecological footprint data to develop policies aimed at achieving sustainable development. I'll discuss some examples of that next."]]}, {"id": "T2_1_15", "test": 2, "src": "Full-Length 2", "module": 1, "range": "15-18", "setting": "in a physics class", "audio": "../resources/audio/tests/student-2/listening/academic-talks/Listening1_Academic Talks_Questions15-18.ogg", "questions": [{"n": 15, "question": "What is the main topic of the talk?", "options": {"A": "How gravity affects stars", "B": "Material in the universe that cannot be directly seen", "C": "The distribution of stars in galaxies", "D": "The formation of the universe"}, "key": "B"}, {"n": 16, "question": "According to the speaker, how do scientists infer the existence of dark matter?", "options": {"A": "From the temperature of visible matter", "B": "From the amount of light in the universe", "C": "From the number of stars in galaxies", "D": "From the speed of stars' movement"}, "key": "D"}, {"n": 17, "question": "Why does the speaker mention computer simulations?", "options": {"A": "To support the claim that dark matter plays an important role in the universe", "B": "To describe how the gravitational forces acting on stars were calculated", "C": "To highlight the anomalies in basic physics", "D": "To explain how the speeds of stars were measured"}, "key": "A"}, {"n": 18, "question": "What will the speaker most likely discuss next?", "options": {"A": "Measurements of dark matter in galaxies", "B": "Ideas about dark matter’s composition", "C": "The anomalies in galaxy rotation caused by dark matter", "D": "The distribution of dark matter in the universe"}, "key": "B"}], "turns": [["Professor", "Dark matter is a type of matter that doesn’t emit, absorb, or reflect light, making it invisible to current instruments. Despite being unobservable directly, it’s believed to make up about 27 percent of the universe’s mass-energy content. How do scientists know dark matter exists? Well, all the stars in a galaxy rotate around the center of their galaxy. According to basic physics, the farther a star is from the center of a galaxy, the slower it should rotate. However, observations show that stars in the outer regions of galaxies rotate at unexpectedly high speeds. This anomaly suggests that a massive, unseen matter is exerting gravitational force, keeping the stars moving faster than expected. Dark matter is hugely important for the structure of the universe. Computer simulations show that galaxies wouldn't have formed the way they did if dark matter hadn't been around. But what does dark matter consist of? Well, there are different theories, so let's consider a couple of them."]]}, {"id": "T2_2_13", "test": 2, "src": "Full-Length 2", "module": 2, "range": "13-16", "setting": "in an environmental science class", "audio": "../resources/audio/tests/student-2/listening/academic-talks/Listening2_Academic Talks_Questions13-16.ogg", "questions": [{"n": 13, "question": "What is the talk mainly about?", "options": {"A": "Ways in which humans use natural materials in clothing and architecture", "B": "Hiding strategies of different animals", "C": "New methods of using renewable energy", "D": "Examples of how humans imitate nature for practical purposes"}, "key": "D"}, {"n": 14, "question": "Why does the speaker mention a dog?", "options": {"A": "To illustrate how an inventor copied animal behavior", "B": "To compare its efficiency in movement with that of humpback whales", "C": "To explain how a structure found in plants inspired an invention", "D": "To show the close bond between scientists and animals"}, "key": "C"}, {"n": 15, "question": "What point does the speaker make about termite mounds?", "options": {"A": "The temperature inside of them does not change much.", "B": "Termites sometimes build them near human-made structures.", "C": "Building them takes a lot of energy.", "D": "They are created mostly from plant material."}, "key": "A"}, {"n": 16, "question": "What does the speaker imply about wind turbine blades that are being developed?", "options": {"A": "The noise they create can be harmful to whales.", "B": "They can be easily installed on buildings.", "C": "They can be efficiently constructed from renewable materials.", "D": "They are very similar to some whales' flippers in shape."}, "key": "D"}], "turns": [["Professor", "Biomimicry is the human practice of learning from and imitating things found in nature in order to create new inventions. This way, scientists and engineers can create innovative solutions that are both efficient and sustainable. One well-known example of biomimicry is the development of a widely used fastening system. The inventor was inspired by the way burrs, uh thorns, from plants stuck to his dog’s fur. By replicating the tiny hooks found on the burrs he removed from the dog fur, he created the new fastening system. Another example is the design of energy-efficient buildings based on the ventilation system of structures created by termites. Termites are ground-dwelling insects that use different materials to create hills, or mounds, in which the termites live. Termite mounds have a complex network of vents. The vents maintain a stable internal temperature, which can be emulated in human architecture. Biomimicry can also be applied to renewable energy. For instance, researchers are developing wind turbine blades modeled after the flippers of humpback whales. The unique shape of the flippers reduces drag and increases efficiency, leading to more effective wind energy capture."]]}, {"id": "T3_1_15", "test": 3, "src": "Teacher Resources 1", "module": 1, "range": "15-18", "setting": "in an anthropology class", "audio": "../resources/audio/tests/teacher-1/listening/academic-talk/Listening1_Academic Talk_Questions_15-18.mp3", "questions": [{"n": 15, "question": "What aspect of the Indigenous peoples of the Northwest coast of North America is the talk mainly about?", "options": {"A": "Their economic structures", "B": "A traditional event that they participate in", "C": "Their relationship with the Canadian government", "D": "The role of dancing and storytelling in their social functions"}, "key": "B"}, {"n": 16, "question": "What can a host gain from a potlatch?", "options": {"A": "Food", "B": "Money", "C": "Items like blankets", "D": "Social status"}, "key": "D"}, {"n": 17, "question": "What does the speaker imply about the Canadian government of the late-nineteenth century?", "options": {"A": "It was not aware of the social function of potlatches.", "B": "It wanted Indigenous people to include other Canadians in potlatches.", "C": "Its policies contributed to economic growth.", "D": "It was extremely wasteful."}, "key": "A"}, {"n": 18, "question": "What aspect of potlatches will the speaker discuss next?", "options": {"A": "The ways in which communities brought them back", "B": "The countries that ban them", "C": "Their effect on wealth distribution", "D": "Their possible future"}, "key": "A"}], "turns": [["Professor", "The potlatch is a ceremonial event among Indigenous peoples of the Pacific Northwest coast of North America. A potlatch involves the host giving away their possessions, including food, blankets, and even money, to guests. This practice serves multiple social functions, like redistributing wealth, reinforcing social bonds, and asserting status. Potlatches are often held to mark significant occasions, like weddings and such, and they involve feasting, dancing, and storytelling. The lavishness of a potlatch can elevate the host’s status by demonstrating wealth and generosity. One fascinating aspect of the potlatch is its role in the social and economic structures of the communities that practice it. By redistributing wealth, potlatches ensure that resources circulate within the community, preventing the concentration of wealth in the hands of a few individuals. This practice strengthens community ties and fosters mutual support. For people who don't understand the function of potlatches, they may appear to be a waste of resources. Potlatches were even prohibited by the Canadian government in the late-nineteenth century because of this perceived wastefulness. The ban was lifted in the mid-twentieth century, and today, potlatches continue to be an important cultural practice. Let's now examine how Indigenous communities have revived this practice."]]}, {"id": "T3_2_13", "test": 3, "src": "Teacher Resources 1", "module": 2, "range": "13-16", "setting": "in an economics class", "audio": "../resources/audio/tests/teacher-1/listening/academic-talk/Listening2_Academic Talk_Questions_13-16.mp3", "questions": [{"n": 13, "question": "What is the main topic of the talk?", "options": {"A": "The advantages of traditional employment", "B": "The benefits of using apps instead of websites", "C": "A new type of work tied to advances in technology", "D": "A plan to restructure contract work"}, "key": "C"}, {"n": 14, "question": "Why does the speaker mention ride-sharing apps and freelance websites?", "options": {"A": "To give examples of digital platforms in the gig economy", "B": "To explain a problem with overhead costs", "C": "To discuss how work conditions for gig workers have improved", "D": "To illustrate technologies used both by companies and by their customers"}, "key": "A"}, {"n": 15, "question": "According to the speaker, what is a challenge for gig workers?", "options": {"A": "High overhead costs", "B": "Limited flexibility", "C": "Lack of a stable income", "D": "Little office space"}, "key": "C"}, {"n": 16, "question": "What will the speaker discuss next?", "options": {"A": "The challenges of digital platforms for gig workers", "B": "The efforts of regulators to protect gig workers", "C": "The types of labor markets with many gig workers", "D": "The advantages of flexible working hours for gig workers"}, "key": "B"}], "turns": [["Professor", "Today, we are going to talk about the concept of the gig economy. The gig economy is a labor market characterized by short-term contracts or freelance work, as opposed to permanent jobs. It has gained significant traction in recent years because of technological advancements and the rise of digital platforms like ride-sharing apps and freelance websites. In a gig economy, workers typically take on multiple short-term jobs or projects, and they often do so through online platforms that connect them directly with clients. This can offer greater flexibility compared to traditional employment, as workers can choose when and where they wanna work. Companies benefit from the gig economy by reducing overhead costs associated with full-time employees, like for office space. This allows them to vary their workforce according to demand, which can be particularly useful during peak seasons or for specific projects. On the other hand, gig workers may face difficulties in securing consistent work and may have to juggle multiple gigs to make a living. Next, we will discuss potential regulatory responses to protect gig workers and after that: the implications of the gig economy on traditional labor markets."]]}, {"id": "T4_1_15", "test": 4, "src": "Teacher Resources 2", "module": 1, "range": "15-18", "setting": "in a psychology class", "audio": "../resources/audio/tests/teacher-2/listening/academic-talk/Listening1_Academic Talk_Questions_15-18.mp3", "questions": [{"n": 15, "question": "What is the main topic of the talk?", "options": {"A": "How a social psychological theory was developed", "B": "How the presence of others can affect a decision", "C": "How to help people in different emergencies", "D": "How to identify emergency situations"}, "key": "B"}, {"n": 16, "question": "According to the talk, how might social influence affect an individual's behavior?", "options": {"A": "A person may interpret a situation as less urgent if no one around them intervenes.", "B": "A person may be unwilling to be the first to act.", "C": "An individual is more likely to act to impress the others in the group.", "D": "An individual is less likely to act when specifically asked to do so."}, "key": "A"}, {"n": 17, "question": "Why does the speaker discuss a study from 2019?", "options": {"A": "To illustrate how new technologies have improved social psychological research", "B": "To provide evidence that challenges earlier research", "C": "To support the idea that it is dangerous for bystanders to offer help", "D": "To argue that not many bystanders are willing to help"}, "key": "B"}, {"n": 18, "question": "What is NOT mentioned as a factor that influences bystander behavior?", "options": {"A": "The number of bystanders", "B": "The degree of danger", "C": "The location of the incident", "D": "The familiarity of bystanders to one another"}, "key": "C"}], "turns": [["Professor", "The bystander effect is a social psychological theory according to which individuals are less likely to offer help to a victim when other people are present. The theory was first proposed by researchers in the 1960s, based on observations. The bystander effect can be explained through two primary factors: diffusion of responsibility and social influence. Diffusion of responsibility occurs when people believe that someone else will take action, and so they feel less personal responsibility. Social influence involves looking to others for cues on how to behave, especially in ambiguous situations. If others are not helping, individuals may interpret the situation as non-emergency and refrain from intervening. More recent studies, however, have disputed the claim that the presence of more bystanders can decrease the likelihood of assistance. One study from 2019 that analyzed video footage from multiple cities found that in 9 out of 10 incidents, at least one bystander did take action to help. This study found that a bystander was actually more likely to intervene when more bystanders were present. Some factors that may influence bystander behavior include the level of danger and whether bystanders know each other."]]}, {"id": "T4_2_13", "test": 4, "src": "Teacher Resources 2", "module": 2, "range": "13-16", "setting": "in an economics class", "audio": "../resources/audio/tests/teacher-2/listening/academic-talk/Listening2_Academic Talk_Questions_13-16.mp3", "questions": [{"n": 13, "question": "What is the main topic of the talk?", "options": {"A": "How the field of behavioral economics developed over time", "B": "Why an assumption in traditional economics is not always correct", "C": "Some examples of unusual human behavior", "D": "The role of policymakers in economics"}, "key": "B"}, {"n": 14, "question": "According to the speaker, what is a problem with using heuristics?", "options": {"A": "They do not allow decisions to be made quickly.", "B": "They can result in mistakes in judgment.", "C": "They ignore the emotional consequences of actions.", "D": "They cause people to focus too much on gains."}, "key": "B"}, {"n": 15, "question": "Why does the speaker mention stocks?", "options": {"A": "To provide an example of people's desire to avoid losses", "B": "To highlight the pleasure of gains", "C": "To describe the importance of rational decision-making", "D": "To discuss the benefits of heuristics."}, "key": "A"}, {"n": 16, "question": "What will the speaker most likely discuss next?", "options": {"A": "A popular practice among investors", "B": "A method that economists use to examine human behavior", "C": "An example of an intervention by policymakers", "D": "A way of helping people improve their decision-making"}, "key": "D"}], "turns": [["Professor", "Behavioral economics is a field that combines insights from psychology and economics to understand how people make economic decisions. Unlike traditional economics, which assumes that individuals act rationally, behavioral economics recognizes that people often behave irrationally due to cognitive biases and emotional factors. One key concept in behavioral economics is the idea of heuristics, which are mental shortcuts that people use to make decisions quickly. While heuristics can be helpful, they can also lead to systematic errors in judgment. For example, the availability heuristic causes people to overestimate the likelihood of events that are widely reported, such as plane crashes, while underestimating more common risks like car accidents. Another important concept is loss aversion, which suggests that people experience the pain of loss more intensely than the pleasure of gain. This can lead to risk-averse behavior, where individuals are more likely to avoid losses than to pursue equivalent gains. For instance, investors might hold onto losing stocks for too long, hoping they will rebound, rather than cutting their losses. Understanding these and other behavioral biases can help policymakers design better economic policies and interventions. Next, we will examine how nudges, or subtle changes in the way choices are presented, can help people reach better decisions."]]}, {"id": "T5_1_15", "test": 5, "src": "Teacher Resources 3", "module": 1, "range": "15-18", "setting": "in a neuroscience class", "audio": "../resources/audio/tests/teacher-3/listening/academic-talk/Listening1_Academic_Talk_Questions_15-18.ogg", "questions": [{"n": 15, "question": "What is the main topic of the talk?", "options": {"A": "The importance of cognitive training to overall brain health", "B": "The brain’s ability to reorganize itself by forming new connections", "C": "Changes in the physical structure of the brain over a lifetime", "D": "The comprehensive anatomy of the human brain"}, "key": "B"}, {"n": 16, "question": "According to the talk, what does neuroplasticity allow the brain to do?", "options": {"A": "Adapt in response to learning and experience", "B": "Protect itself from excessive stimulation", "C": "Activate parts of the brain that are not ordinarily used", "D": "Transmit signals faster between neurons"}, "key": "A"}, {"n": 17, "question": "Which of the following lets certain areas of the brain take over roles previously managed by other regions?", "options": {"A": "Cognitive neuroplasticity", "B": "Structural neuroplasticity", "C": "Physical neuroplasticity", "D": "Functional neuroplasticity"}, "key": "D"}, {"n": 18, "question": "What point does the professor make about physical exercise?", "options": {"A": "It is beneficial to exercise at any time of day.", "B": "It allows the brain to cool down and rest.", "C": "It supports brain health by increasing a certain protein.", "D": "It is good to consume protein after exercising."}, "key": "C"}], "turns": [["Man", "Today we’re exploring neuroplasticity, which means the brain’s ability to reorganize itself by forming new neural connections throughout life. Neuroplasticity allows the brain to adapt in response to learning, experience, and other stimulation. This remarkable capacity for change is crucial for cognitive development and skill acquisition. There are two main types of neuroplasticity: structural and functional. Structural neuroplasticity involves changes in the physical structure of the brain, such as the growth of new neurons or the strengthening of synapses. Functional neuroplasticity, on the other hand, refers to changes in the brain’s activity patterns, allowing different areas to take over functions previously managed by underperforming regions. For example, if a region responsible for language processing becomes less active, nearby or even distant areas may increase their activity to support language functions. Now, research has shown that engaging in activities that stimulate the brain, such as learning new skills, physical exercise, and cognitive training, can enhance both structural and functional neuroplasticity. Consider aerobic exercises like running or swimming—they help the brain by boosting a special protein called BDNF, which works like fertilizer for brain cells, helping them grow and stay healthy. Understanding neuroplasticity has important implications for creating strategies that promote brain resilience. By leveraging neuroplasticity, researchers and practitioners aim to support cognitive vitality in people of all ages."]]}, {"id": "T5_2_13", "test": 5, "src": "Teacher Resources 3", "module": 2, "range": "13-16", "setting": "in a chemistry class", "audio": "../resources/audio/tests/teacher-3/listening/academic-talk/Listening2_Academic_Talk_Questions_13-16.ogg", "questions": [{"n": 13, "question": "What is the main topic of the talk?", "options": {"A": "How a chemical reaction progresses from start to finish", "B": "The role of catalysts in chemical reactions", "C": "Materials used in the production of nanozymes", "D": "The importance of enzymes in digestion"}, "key": "B"}, {"n": 14, "question": "What point does the professor make about the unchanging nature of catalysts?", "options": {"A": "It makes them easier to produce in laboratories.", "B": "It causes them to lack flexibility.", "C": "It allows them to be used repeatedly.", "D": "It makes them inefficient for some complex chemical processes."}, "key": "C"}, {"n": 15, "question": "Why does the professor mention a cake?", "options": {"A": "To show how catalysts make reactions occur with less energy", "B": "To point out a common problem with digestion", "C": "To illustrate how certain enzymes produce high temperatures", "D": "To explain how chemical reactions can influence cake flavor"}, "key": "A"}, {"n": 16, "question": "What does the example of environmental cleanup reveal about nanozymes?", "options": {"A": "They are expensive to produce.", "B": "They can be found abundantly in nature.", "C": "They perform reliably in extreme settings.", "D": "They are most effective at breaking down plastics."}, "key": "C"}], "turns": [["Woman", "Today, I want to talk about a fascinating topic in chemistry: catalysts— substances that speed up chemical reactions without being used up. Think of them as helpful assistants that make reactions happen faster and more efficiently, while staying unchanged. This means they don’t become part of the final product, so they can be reused again and again in multiple reactions. Catalysts are everywhere. In our bodies, enzymes act as natural catalysts, helping with digestion and metabolism. In industry, they’re essential for making plastics, medicines, and fuels. What makes catalysts powerful is that they lower the energy needed for a reaction to happen. Imagine baking a cake: the recipe says to heat the oven to 400°F, but someone gives you a special pan that lets it bake perfectly at 300°F. That pan is like a catalyst—it helps the ingredients become a cake, a product, using less energy. Now, let’s look at something even more advanced: nanozymes. These are tiny, artificial materials that mimic enzymes. They’re more stable in harsh conditions like heat or acidity, cheaper to produce, and can be tailored for specific tasks. For example, nanozymes are used in environmental cleanup efforts. They can break down harmful pollutants in extreme conditions—like polluted water or industrial waste—things like pesticides, dyes, or heavy metals—turning them into safer, less toxic substances."]]}, {"id": "T6_1_15", "test": 6, "src": "Teacher Resources 4", "module": 1, "range": "15-18", "setting": "in a neuroscience class", "audio": "../resources/audio/tests/teacher-4/listening/academic-talk/Listening1_Academic_Talk_Questions_15-18.ogg", "questions": [{"n": 15, "question": "How is the talk mainly organized?", "options": {"A": "It contrasts children’s innate linguistic capabilities with those of adults.", "B": "It lists the principles of Noam Chomsky’s theory of Universal Grammar.", "C": "It describes the differences between two methods of teaching language.", "D": "It discusses the two main types of language acquisition."}, "key": "D"}, {"n": 16, "question": "Why does the speaker mention Noam Chomsky’s theory of Universal Grammar?", "options": {"A": "To highlight the importance of formal education in language learning", "B": "To explain why children are able to pick up their native language quickly", "C": "To describe how some languages are more complex than others", "D": "To provide background on the critical period hypothesis"}, "key": "B"}, {"n": 17, "question": "What does the speaker say about motivation and language acquisition?", "options": {"A": "Higher motivation makes it easier for a person to acquire a second language.", "B": "Motivation becomes less important to language acquisition as a person ages.", "C": "Children with increased exposure to a second language are more motivated to learn it.", "D": "Formal education does not motivate people to acquire a second language."}, "key": "A"}, {"n": 18, "question": "According to the speaker, what is suggested by the critical period hypothesis?", "options": {"A": "People with innate linguistic capabilities acquire language easily.", "B": "There is an optimal window in early childhood for language acquisition.", "C": "A longer period of language exposure supports better learning.", "D": "Second language acquisition occurs most easily in early adulthood."}, "key": "B"}], "turns": [["Man", "(M-Br) Let’s talk a little about language acquisition, which is the process by which humans learn to understand and use language. There are two main types of language acquisition: first language acquisition and second language acquisition. First language acquisition occurs naturally and with relative ease during early childhood, through interaction with family and the surrounding environment. Children are able to pick up their native language quickly due to their innate linguistic capabilities, a concept supported by the linguist Noam Chomsky’s theory of Universal Grammar. Universal Grammar suggests that the ability to acquire language is innate to humans and that all human languages share a common underlying structure. Second language acquisition, on the other hand, often requires more conscious effort and formal education and typically happens later in life. Several factors influence the ease and success of second language acquisition, including exposure to the language, age, and motivation. Motivation, in particular, plays a crucial role—highly motivated individuals are more likely to engage actively with the language and persist in their learning efforts. Age is also significant; according to the critical period hypothesis, there is an optimal window in early childhood during which language acquisition occurs most easily. After this period, acquiring a new language can be more challenging. Understanding these processes helps educators and linguists develop effective teaching methods and language learning tools."]]}, {"id": "T6_2_13", "test": 6, "src": "Teacher Resources 4", "module": 2, "range": "13-16", "setting": "in a chemistry class", "audio": "../resources/audio/tests/teacher-4/listening/academic-talk/Listening2_Academic_Talk_Questions_13-16.ogg", "questions": [{"n": 13, "question": "What is the main topic of the talk?", "options": {"A": "Replacing fossil fuels with more sustainable energy sources", "B": "A way of measuring the effects of human activities on the environment", "C": "How fossil fuel use leads to global warming", "D": "The importance of water conservation to a sustainable future"}, "key": "B"}, {"n": 14, "question": "According to the speaker, the ecological footprint is expressed in terms of", "options": {"A": "area of land and water needed", "B": "amount of greenhouse gas produced", "C": "global temperature increase", "D": "number of natural resources consumed"}, "key": "A"}, {"n": 15, "question": "What does the speaker say about the carbon footprint?", "options": {"A": "It primarily applies to industrial activities.", "B": "It includes tracking the biodiversity of an ecosystem.", "C": "It is a component of the ecological footprint.", "D": "It considers the number of vehicles in a given area."}, "key": "C"}, {"n": 16, "question": "What is one cause of resource depletion that the speaker mentions?", "options": {"A": "Environmental policies", "B": "Food consumption", "C": "Generation of waste", "D": "Carbon emissions"}, "key": "B"}], "turns": [["Woman", "Today we’re discussing the notion of the ecological footprint, something that measures the impact of human activities on the environment uh, in terms of the amount of natural resources we consume and the waste we generate. The ecological footprint is often expressed in terms of number of global hectares. This number represents the total area of biologically productive land or water needed in order to support human activity. It considers various factors, including carbon emissions, food consumption, water usage, and land development. One primary component of the ecological footprint is the carbon footprint, which measures the amount of greenhouse gases emitted due to consumption of fossil fuels like petroleum and coal. High carbon footprints contribute significantly to global warming. Another important aspect is our consumption of natural resources like water and food, which can lead to resource depletion and environmental degradation. The concept of ecological footprint is crucial for understanding and addressing the sustainability of human activities. By measuring our ecological footprint, individuals, companies, and even whole countries can identify areas where they can reduce their impact on the environment. This could include adopting practices like recycling, conserving water, using renewable energy, and reducing waste."]]}, {"id": "T7_1_15", "test": 7, "src": "Teacher Resources 5", "module": 1, "range": "15-18", "setting": "on a psychology podcast", "audio": "../resources/audio/tests/teacher-5/listening/academic-talk/Listening1_Academic_Talk_Questions_15-18.ogg", "questions": [{"n": 15, "question": "What does the speaker mainly discuss?", "options": {"A": "How scientists first discovered the placebo effect", "B": "How the brain drives the placebo effect", "C": "What types of medications are used in clinical trials", "D": "What role pharmaceutical companies play in placebo research"}, "key": "B"}, {"n": 16, "question": "What point does the speaker make about the various types of placebos?", "options": {"A": "They should be cheaper than the actual treatment.", "B": "They should be colorful and eye-catching.", "C": "They must undergo testing before clinical use.", "D": "They must resemble real treatments."}, "key": "D"}, {"n": 17, "question": "Why does the speaker discuss “creating a kind of bridge”?", "options": {"A": "To illustrate how expectation can lead to physical response", "B": "To describe how medicine travels through the body", "C": "To clarify how emotions can block medical progress", "D": "To discuss the chemical composition of placebos"}, "key": "A"}, {"n": 18, "question": "What is the speaker's opinion about the use of placebos in health care?", "options": {"A": "Placebos are not very relevant to patient care.", "B": "Placebos can complement traditional therapies.", "C": "Placebos are only beneficial in psychological experiments.", "D": "Placebos should be studied more before being used in clinical settings."}, "key": "B"}], "turns": [["Woman", "The placebo effect occurs when people experience real health improvements after receiving a treatment with no medical value—like a sugar pill—simply because they believe it’s real. Clinical trials use various placebos, including creams, gels, or even fake devices. It’s important that these are designed to closely resemble actual treatments. This ensures that participants can’t tell whether they’re receiving the real treatment or the placebo, which in turn keeps the study fair and the results scientifically reliable. The placebo effect highlights the powerful connection between mind and body. It’s influenced by factors such as patient expectations, how the treatment is delivered, and the provider’s credibility. In fact, a recent study found that when people expect relief, their brains respond as if real medicine has been given. This expectation alone can trigger specific brain activity, activating a pathway that links regions involved in thought, emotion, and movement. When these areas work together, they create a kind of bridge, connecting mind and body—mental belief and physical response. While placebos don’t actually cure diseases, the belief that a treatment will work can lead to real improvements in how a patient feels. So, when combined with actual medicine, I believe this psychological boost can enhance overall care."]]}, {"id": "T7_2_13", "test": 7, "src": "Teacher Resources 5", "module": 2, "range": "13-16", "setting": "in an environmental science class", "audio": "../resources/audio/tests/teacher-5/listening/academic-talk/Listening2_Academic_Talk_Questions_13-16.ogg", "questions": [{"n": 13, "question": "What is the main topic of the talk?", "options": {"A": "The effects of global warming", "B": "The concept of the carbon footprint", "C": "The benefits of renewable energy", "D": "The role of governments in sustainability"}, "key": "B"}, {"n": 14, "question": "According to the talk, what can individuals do to lower their carbon footprint?", "options": {"A": "Increase meat consumption", "B": "Use public transportation", "C": "Manufacture more goods", "D": "Trap heat in the atmosphere"}, "key": "B"}, {"n": 15, "question": "Why does the speaker mention livestock farming?", "options": {"A": "To explain a source of methane emissions", "B": "To discuss public transportation options", "C": "To highlight energy-efficient practices", "D": "To illustrate the impact of manufacturing goods"}, "key": "A"}, {"n": 16, "question": "What can be inferred about the role of governments in reducing carbon footprints?", "options": {"A": "They can only set emissions targets.", "B": "They are the primary source of greenhouse gases.", "C": "They can implement policies to promote carbon reduction.", "D": "They have a minimal impact on sustainability."}, "key": "C"}], "turns": [["Man", "Today, we’re discussing the concept of the carbon footprint and its implications for environmental sustainability. A carbon footprint measures the total amount of greenhouse gases produced directly and indirectly by human activities, usually expressed in equivalent tons of carbon dioxide. This includes emissions from activities such as driving a car, using electricity, and manufacturing goods. The importance of understanding our carbon footprint lies in its impact on global warming and climate change. Greenhouse gases trap heat in the atmosphere, leading to rising global temperatures, melting ice caps, and more extreme weather events. By measuring our carbon footprint, we can identify the main sources of emissions and take steps to reduce them. For instance, individuals can lower their carbon footprint by opting for public transportation, using energy-efficient appliances, and reducing meat consumption, since livestock farming is a significant source of methane emissions, a potent greenhouse gas. Businesses can also play a crucial role by adopting sustainable practices like using renewable energy sources, improving energy efficiency, and minimizing waste. Moreover, governments can implement policies that promote carbon reduction, such as setting emissions targets, providing incentives for green technologies, and investing in sustainable infrastructure. Reducing our carbon footprint is essential for mitigating climate change and promoting a healthier planet for future generations. It requires collective effort and awareness to make meaningful progress."]]}];
const KEY = 'listenTalk_v1';
const CAUSES = [
 ['', '— pick the cause —', ''],
 ['D1 Missed a detail', 'D1 Missed a detail', 'Did I miss a fact, number or name that the speaker said?'],
 ['D2 Missed the main point', 'D2 Missed the main point', 'Did I mix up the topic or the organisation of the talk with an example or a side detail?'],
 ['D3 Missed why an example was used', 'D3 Missed why an example was used', 'Did I remember the example but not the point it was there to support?'],
 ['D4 Missed implied meaning', 'D4 Missed implied meaning', 'Was the answer implied or an opinion, not stated word for word?'],
 ['D5 Echo / near-paraphrase', 'D5 Echo / near-paraphrase', 'Did I pick it because it repeated words I heard, while the meaning was off?'],
 ['D6 Stopped at first fit', 'D6 Stopped at first fit', 'Did I stop at the first option that sounded fine without testing the other three?'],
 ['D7 Lost the thread', 'D7 Lost the thread', 'Did I lose focus while the talk played, or forget the early part by the time the questions appeared?'],
 ['D8 Misread NOT / next-topic', 'D8 Misread NOT / next-topic', 'Did I miss the word NOT, or answer what was said instead of what will come next?'],
 ['Changed answer', 'Changed answer', 'Did I switch from the right answer? What made me switch?'],
 ['Guessed', 'Guessed', 'No idea. What could I have noted down while listening?'],
 ['Careless', 'Careless', 'Knew it, mis-clicked or rushed.'],
 ['Other', 'Other', 'Explain in the note.']
];
const CAUSE_HINT = Object.fromEntries(CAUSES.map(c => [c[0], c[2]]));
// Heuristic tag from the question wording. Not an official label.
function qtype(q) {
  const t = q.toLowerCase();
  if (/\bnot\b.*(mention|true|say|factor)|except/.test(t)) return 'NOT / except';
  if (/impl(y|ies)|suggest|infer|conclu|opinion|attitude/.test(t)) return 'Implication';
  if (/will .* (most likely|next|discuss)|discuss next|probably/.test(t)) return 'Next topic';
  if (/why does .* (mention|discuss|use|say)|why did .* (mention|discuss)|what does .* (example|mean)|what is the purpose|function of/.test(t)) return 'Why mention';
  if (/main|mainly|topic|organi[sz]ed|talk about|purpose of the talk/.test(t)) return 'Main idea / organisation';
  return 'Detail';
}
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S = (() => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } })();
S.mods = S.mods || {}; S.mode = S.mode || 'exam';
const save = () => localStorage.setItem(KEY, JSON.stringify(S));
const conv = id => DATA.find(c => c.id === id);
const scored = c => c.questions.filter(q => !q.flag).length;
const score = id => { const c = conv(id), s = S.mods[id]; return s ? c.questions.reduce((a, q, i) => a + (!q.flag && s.ans[i] === q.key ? 1 : 0), 0) : 0; };
const fmt = s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
const label = c => `M${c.module} · Q${c.range.replace('-', '–')}`;
let cur = (S.cur && conv(S.cur)) ? S.cur : DATA[0].id;
let view = 'intro', qi = 0, audio = null, audioDone = false, qStart = 0, runStart = 0, tick = null;
let run = null;   // in-progress attempt: {ans, ms, replays}

function stopAudio() { if (audio) { audio.pause(); audio.onended = audio.onerror = null; audio = null; } }
function startTimer() { clearInterval(tick); tick = setInterval(() => { if (view === 'run') $('#timer').textContent = fmt(Math.floor((Date.now() - runStart) / 1000)); }, 500); }

function renderNav() {
  let h = '', last = 0;
  DATA.forEach(c => {
    if (c.test !== last) { last = c.test; h += `<div class="group">Test ${c.test} · ${esc(c.src)}</div>`; }
    const s = S.mods[c.id], done = s && s.done;
    h += `<button class="mod ${c.id === cur ? 'active' : ''}" data-id="${c.id}"><span>${label(c)}</span><span class="badge ${done ? 'done' : ''}">${done ? score(c.id) + '/' + scored(c) : '—'}</span></button>`;
  });
  $('#nav').innerHTML = h;
  document.querySelectorAll('.mod').forEach(b => b.onclick = () => {
    if (view === 'run' && !confirm('Leave this talk? Your answers so far will be discarded.')) return;
    open(b.dataset.id); });
  const dc = DATA.filter(c => S.mods[c.id] && S.mods[c.id].done);
  const tot = dc.reduce((a, c) => a + score(c.id), 0), den = dc.reduce((a, c) => a + scored(c), 0);
  $('#totals').textContent = `Completed: ${dc.length}/14 · ${tot}/${den}${den ? ' (' + Math.round(100 * tot / den) + '%)' : ''}`;
}

function open(id) {
  stopAudio(); clearInterval(tick); cur = id; S.cur = id; save(); run = null;
  const s = S.mods[id]; view = s && s.done ? 'review' : 'intro'; render();
}

function render() {
  const c = conv(cur); renderNav();
  $('#title').textContent = `Test ${c.test} · ${c.src} · ${label(c)}`;
  $('#mode').value = S.mode;
  const s = S.mods[cur];
  if (view !== 'run') $('#timer').textContent = fmt(s ? s.secs : 0);
  if (view === 'intro') renderIntro(); else if (view === 'run') renderRun(); else renderReview();
}

function dots(c, s, active) {
  return '<div class="prog">' + c.questions.map((q, i) => {
    let k = '';
    if (s && s.done) k = q.flag ? 'skip' : (s.ans[i] === q.key ? 'ok' : 'bad');
    else if (run && i < run.ans.length) k = 'on'; else if (i === active) k = 'on';
    return `<div class="dot ${k}"></div>`; }).join('') + '</div>';
}

function renderIntro() {
  const c = conv(cur), exam = S.mode === 'exam';
  $('#view').innerHTML = `<div class="card"><h2>Listen to a talk</h2>
    <p>You will hear a short academic talk (${esc(c.setting)}), then answer ${c.questions.length} questions about it.</p>
    <p class="muted">${exam ? 'Exam mode: the talk plays once. The questions appear when it ends, and you cannot go back or replay.' : 'Practice mode: you can replay the talk and go back between questions.'} Leaving the talk midway discards your answers. Turn the volume up before you start.</p>
    <button class="primary" id="startBtn">Start</button></div>`;
  $('#startBtn').onclick = () => { run = {ans: [], ms: [], replays: [0, 0]}; qi = 0; view = 'run'; runStart = Date.now(); startTimer(); render(); };
}

function playConv(box) {
  const c = conv(cur); stopAudio();
  audio = new Audio(encodeURI(c.audio)); const a = audio;
  a.onended = () => { audioDone = true; box.className = 'listen done'; box.innerHTML = '<span class="ico">✓</span><span>The talk has ended.</span>'; revealQ(); };
  a.onerror = () => { box.className = 'listen err'; box.innerHTML = `<span class="ico">⚠</span><span>Audio could not be loaded: <code>${esc(c.audio)}</code>. Use Arc or Chrome and check the file exists.</span><button id="skipAudio">Show questions anyway</button>`; box.querySelector('#skipAudio').onclick = () => { audioDone = true; revealQ(); }; };
  box.className = 'listen'; box.innerHTML = '<span class="ico">🔊</span><span>Listening…</span>';
  a.play().catch(e => {
    if (audio !== a || e.name !== 'NotAllowedError') return;
    box.innerHTML = '<span class="ico">▶</span><span>Your browser blocked autoplay. </span><button id="manual" class="primary">Play audio</button>';
    box.querySelector('#manual').onclick = () => { box.className = 'listen'; box.innerHTML = '<span class="ico">🔊</span><span>Listening…</span>'; a.play(); };
  });
}

function renderRun() {
  const c = conv(cur), exam = S.mode === 'exam';
  audioDone = false;
  $('#view').innerHTML = `<div class="card"><div id="dots"></div>
    <div class="listen" id="listen"></div>
    ${exam ? '' : '<div class="row" style="margin-bottom:14px"><button id="replay">↻ Replay talk</button></div>'}
    <div id="qwrap"></div></div>`;
  $('#dots').innerHTML = dots(c, null, qi);
  if (!exam) { $('#replay').onclick = () => { run.replays[qi] = (run.replays[qi] || 0) + 1; playConv($('#listen')); }; renderQ(); }
  playConv($('#listen'));
}

function revealQ() { if (S.mode === 'exam') renderQ(); }

function renderQ() {
  const c = conv(cur), q = c.questions[qi], exam = S.mode === 'exam', last = qi === c.questions.length - 1;
  qStart = Date.now();
  $('#dots').innerHTML = dots(c, null, qi);
  $('#qwrap').innerHTML = `<div class="qhead"><span class="qnum">Question ${qi + 1} of ${c.questions.length}</span></div>
    <div class="stem">${esc(q.question)}</div>
    <div id="opts">${['A', 'B', 'C', 'D'].map(l => `<label class="opt"><input type="radio" name="o" value="${l}"><span class="l">${l}</span><span>${esc(q.options[l])}</span></label>`).join('')}</div>
    <div class="row" style="margin-top:14px">
      ${exam ? '' : `<button id="back" ${qi === 0 ? 'disabled' : ''}>← Back</button>`}
      <button class="primary" id="nextBtn" disabled>${last ? 'Finish' : 'Next →'}</button></div>`;
  document.querySelectorAll('input[name=o]').forEach(r => r.onchange = () => {
    $('#nextBtn').disabled = false; run.pick = r.value;
    document.querySelectorAll('.opt').forEach(o => o.classList.toggle('sel', o.querySelector('input').checked)); });
  $('#nextBtn').onclick = next;
  if (!exam) { const b = $('#back'); if (b) b.onclick = () => { qi--; renderQ(); }; }
  if (run.ans[qi]) { const r = document.querySelector(`input[value=${run.ans[qi]}]`); if (r) { r.checked = true; r.onchange(); } }
}

function next() {
  const c = conv(cur); if (!run.pick || !document.querySelector('input[name=o]:checked')) return;
  run.ans[qi] = run.pick; run.ms[qi] = Math.max(0, Date.now() - qStart); run.pick = null;
  if (qi < c.questions.length - 1) { qi++; renderQ(); return; }
  stopAudio(); clearInterval(tick);
  S.mods[cur] = {ans: run.ans, ms: run.ms, replays: run.replays, cause: {}, note: {}, done: true,
    secs: Math.floor((Date.now() - runStart) / 1000), date: new Date().toISOString().slice(0, 16).replace('T', ' ')};
  run = null; save(); view = 'review'; render();
}

function renderReview() {
  const c = conv(cur), s = S.mods[cur], sc = score(cur), den = scored(c);
  const miss = c.questions.filter((q, i) => !q.flag && s.ans[i] !== q.key).length;
  let h = `<div class="card"><div class="score">${sc} / ${den}</div><div class="muted">${miss ? miss + ' to review' : 'All correct'}${den < c.questions.length ? ' · ' + (c.questions.length - den) + ' not scored' : ''} · time ${fmt(s.secs)} · ${esc(s.date || '')}</div>${dots(c, s, -1)}</div>`;
  h += `<div class="card"><div class="row"><b>Transcript</b><button data-play="1">🔊 Play audio</button></div><div class="turns">${c.turns.map(t => `<div class="turn"><b>${esc(t[0])}</b><span>${esc(t[1])}</span></div>`).join('')}</div></div>`;
  c.questions.forEach((q, i) => {
    const a = s.ans[i], ok = a === q.key, fl = !!q.flag;
    h += `<div class="card"><div class="qhead"><span class="qnum">Q${q.n}</span>${fl ? '<span class="tag skip">Not scored</span>' : `<span class="tag ${ok ? 'ok' : 'bad'}">${ok ? 'Correct' : 'Wrong'}</span>`}
      <span class="tag type">${esc(qtype(q.question))}</span><span>decision ${(s.ms[i] / 1000).toFixed(1)}s${s.replays && s.replays[i] ? ' · ' + s.replays[i] + ' replay(s)' : ''}</span></div>
      ${fl ? `<div class="warn">${esc(q.flag)}</div>` : ''}
      <div class="stem">${esc(q.question)}</div>
      ${['A', 'B', 'C', 'D'].map(l => `<div class="opt static ${l === q.key ? 'right' : (l === a ? 'wrong' : '')}"><span class="l">${l}</span><span>${esc(q.options[l])}${l === q.key ? ' ✓' : ''}${l === a && !ok ? ' ← your answer' : ''}</span></div>`).join('')}
      ${ok || fl ? '' : `<div class="fb"><label>Why did I miss it?
        <select data-cause="${i}">${CAUSES.map(x => `<option value="${esc(x[0])}" ${(s.cause[i] || '') === x[0] ? 'selected' : ''}>${esc(x[1])}</option>`).join('')}${s.cause[i] && !CAUSE_HINT.hasOwnProperty(s.cause[i]) ? `<option selected>${esc(s.cause[i])} (older)</option>` : ''}</select></label>
        <div class="hint" id="hint${i}">${esc(CAUSE_HINT[s.cause[i] || ''] || '')}</div>
        <textarea data-note="${i}" placeholder="What did I hear, and what exactly led me to the wrong option?">${esc(s.note[i] || '')}</textarea></div>`}</div>`;
  });
  $('#view').innerHTML = h;
  document.querySelectorAll('[data-play]').forEach(b => b.onclick = () => { stopAudio(); audio = new Audio(encodeURI(c.audio)); audio.play(); });
  document.querySelectorAll('[data-cause]').forEach(x => x.onchange = () => { s.cause[x.dataset.cause] = x.value; $('#hint' + x.dataset.cause).textContent = CAUSE_HINT[x.value] || ''; save(); });
  document.querySelectorAll('[data-note]').forEach(x => x.oninput = () => { s.note[x.dataset.note] = x.value; save(); });
}

function exportMd() {
  const pipe = t => String(t == null ? '' : t).replace(/\|/g, '\\|').replace(/\n/g, ' ');
  const dc = DATA.filter(c => S.mods[c.id] && S.mods[c.id].done);
  const tot = dc.reduce((a, c) => a + score(c.id), 0), den = dc.reduce((a, c) => a + scored(c), 0);
  let o = `# Listening Type D — Listen to an Academic Talk (exported ${new Date().toISOString().slice(0, 16).replace('T', ' ')})\n\nTotal: ${tot}/${den} across ${dc.length}/14 talks · mode at export: ${S.mode}\n\n| Announcement | Source | Score | Time | Avg decision | Replays |\n|---|---|---|---|---|---|\n`;
  dc.forEach(c => { const s = S.mods[c.id]; const avg = s.ms.reduce((a, b) => a + b, 0) / s.ms.length / 1000;
    o += `| T${c.test} ${label(c)} | ${c.src} | ${score(c.id)}/${scored(c)}${scored(c) < c.questions.length ? ' (1 not scored)' : ''} | ${fmt(s.secs)} | ${avg.toFixed(1)}s | ${(s.replays || []).reduce((a, b) => a + (b || 0), 0)} |\n`; });
  let any = false, rows = '';
  dc.forEach(c => { const s = S.mods[c.id]; c.questions.forEach((q, i) => { if (!q.flag && s.ans[i] !== q.key) { any = true;
    rows += `| T${c.test} M${c.module} Q${q.n} | ${pipe(q.question)} | ${pipe(qtype(q.question))} | ${s.ans[i]}. ${pipe(q.options[s.ans[i]])} | ${q.key}. ${pipe(q.options[q.key])} | ${pipe(s.cause[i] || '')} | ${pipe(s.note[i] || '')} |\n`; } }); });
  o += any ? `\n## Misses\n\n| Item | Question | Type (auto) | My answer | Key | Cause | Note |\n|---|---|---|---|---|---|---|\n${rows}` : '\nNo misses recorded.\n';
  $('#exportText').value = o; $('#exportbox').hidden = false; $('#exportText').scrollIntoView({behavior: 'smooth'});
}

$('#mode').onchange = e => { S.mode = e.target.value; save(); if (view === 'run') { stopAudio(); run = {ans: [], ms: [], replays: [0, 0]}; qi = 0; runStart = Date.now(); renderRun(); } else render(); };
$('#resetBtn').onclick = () => { if (confirm('Reset this talk? Your answers and notes for it will be deleted.')) { stopAudio(); clearInterval(tick); delete S.mods[cur]; save(); run = null; view = 'intro'; render(); } };
$('#exportBtn').onclick = exportMd;
$('#copyBtn').onclick = () => { $('#exportText').select(); document.execCommand('copy'); $('#copied').textContent = 'Copied'; setTimeout(() => $('#copied').textContent = '', 1500); };
document.addEventListener('keydown', e => {
  if (view !== 'run' || /TEXTAREA|SELECT/.test(e.target.tagName) || !$('#opts')) return;
  const k = e.key.toUpperCase();
  if (k.length === 1 && 'ABCD'.includes(k)) { const r = document.querySelector(`input[value=${k}]`); if (r) { r.checked = true; r.onchange(); } }
  else if (e.key === 'Enter' && $('#nextBtn') && !$('#nextBtn').disabled) next();
});
open(cur);
</script></body></html>
