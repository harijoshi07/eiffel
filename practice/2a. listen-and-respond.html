<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TOEFL Listening — Listen and Choose a Response</title>
<style>
:root{--bg:#f7f2ea;--card:#fffdf9;--ink:#2d2a26;--muted:#8a8178;--line:#e6ddd0;--terra:#c46a4a;--terra-soft:#f3e0d6;--sage:#7d9a7e;--sage-soft:#e2ebe2;--red:#b5483a;--red-soft:#f6dcd7}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.6}
.wrap{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
aside{background:var(--card);border-right:1px solid var(--line);padding:24px 18px;position:sticky;top:0;height:100vh;overflow:auto}
h1{font-size:18px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px}
.group{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 0 6px}
.mod{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:0;padding:8px 10px;border-radius:10px;cursor:pointer;color:var(--ink);font:inherit;text-align:left}
.mod:hover{background:var(--bg)}
.mod.active{background:var(--terra-soft)}
.badge{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--line);color:var(--muted)}
.badge.done{background:var(--sage-soft);color:#3f6143}
.totals{margin-top:22px;font-size:13px;color:var(--muted)}
main{padding:28px 36px;max-width:860px;width:100%}
.bar{position:sticky;top:0;z-index:5;background:rgba(247,242,234,.94);backdrop-filter:blur(6px);display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--line);margin-bottom:22px}
.bar .title{font-weight:600;margin-right:auto;font-size:15px}
.timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;min-width:56px}
button,select{font:inherit}
button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 14px;border-radius:999px;cursor:pointer}
button.primary{background:var(--terra);border-color:var(--terra);color:#fff}
button:disabled{opacity:.45;cursor:not-allowed}
button:hover:not(:disabled){filter:brightness(.97)}
.bar select{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px 30px;margin-bottom:16px}
.card h2{margin:0 0 10px;font-size:20px}
.muted{color:var(--muted)}
.prog{display:flex;gap:6px;margin-bottom:18px}
.dot{flex:1;height:6px;border-radius:3px;background:var(--line)}
.dot.on{background:var(--terra)}.dot.ok{background:var(--sage)}.dot.bad{background:var(--red)}
.listen{display:flex;align-items:center;gap:14px;padding:18px 20px;border-radius:14px;background:var(--terra-soft);margin-bottom:18px}
.listen .ico{font-size:26px}
.listen.err{background:var(--red-soft);color:var(--red)}
.opt{display:flex;gap:12px;align-items:flex-start;padding:11px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:9px;cursor:pointer;background:#fff}
.opt input{margin-top:6px}
.opt .l{font-weight:600;color:var(--terra);min-width:18px}
.opt.sel{border-color:var(--terra);background:var(--terra-soft)}
.opt.right{border-color:var(--sage);background:var(--sage-soft)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt.static{cursor:default}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.qhead{display:flex;gap:10px;align-items:center;margin-bottom:8px;font-size:13px;color:var(--muted)}
.qnum{font-weight:600;color:var(--terra)}
.tag{font-size:12px;padding:1px 9px;border-radius:999px}
.tag.ok{background:var(--sage-soft);color:#3f6143}.tag.bad{background:var(--red-soft);color:var(--red)}
.prompt{font-weight:500;margin:4px 0 12px}
.fb{margin-top:10px;font-size:14px;border-top:1px dashed var(--line);padding-top:10px}
.fb select,.fb textarea{width:100%;margin-top:6px;font:inherit;border:1px solid var(--line);border-radius:10px;padding:8px;background:#fff}
.fb textarea{min-height:56px}
.hint{font-size:12.5px;color:var(--muted);margin:6px 0 2px;line-height:1.4}
.exportbox textarea{width:100%;min-height:260px;font:13px ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}
.score{font-size:34px;font-weight:700;color:var(--terra);line-height:1.1}
.note{font-size:12px;color:var(--muted);margin-top:18px}
@media(max-width:900px){.wrap{grid-template-columns:1fr}aside{position:static;height:auto}main{padding:18px}}
</style></head>
<body><div class="wrap">
<aside>
  <h1>Listen &amp; Choose a Response</h1>
  <div class="sub">8 questions × 14 modules</div>
  <div id="nav"></div>
  <div class="totals" id="totals"></div>
  <div class="note">Audio plays from <code>../resources/audio</code>, so this page works only on this computer, in a browser that plays Ogg Vorbis (Arc and Chrome do; Safari does not).</div>
</aside>
<main>
  <div class="bar">
    <div class="title" id="title"></div>
    <span class="timer" id="timer">00:00</span>
    <select id="mode" title="Exam: audio plays once and you cannot go back. Practice: replay allowed.">
      <option value="exam">Exam mode (play once)</option><option value="practice">Practice mode (replay)</option>
    </select>
    <button id="resetBtn">Reset module</button>
    <button id="exportBtn">Export log</button>
  </div>
  <div id="view"></div>
  <div class="exportbox" id="exportbox" hidden>
    <h2 style="font-size:16px">Markdown log</h2>
    <textarea id="exportText" readonly></textarea>
    <div class="row" style="margin-top:8px"><button id="copyBtn">Copy</button><span class="muted" id="copied"></span></div>
  </div>
</main></div>
<script>
const DATA = [{"id": "T1_1", "test": 1, "src": "Full-Length 1", "module": 1, "items": [{"n": 1, "speaker": "Woman", "prompt": "Didn’t I just see you in the library an hour ago?", "options": {"A": "As a matter of fact, I was returning a book.", "B": "Yes, you can find it in the reference section.", "C": "I don’t think I’ll have enough time to do that.", "D": "Actually, I think I can get there a little earlier."}, "key": "A", "audio": "../resources/audio/tests/student-1/listening/question-response/Listening1_Question Response_Question1.ogg"}, {"n": 2, "speaker": "Man", "prompt": "Where is the nearest bus stop?", "options": {"A": "I nearly missed the bus.", "B": "Every 30 minutes.", "C": "I can help you find it.", "D": "I'll take the subway instead."}, "key": "C", "audio": "../resources/audio/tests/student-1/listening/question-response/Listening1_Question Response_Question2.ogg"}, {"n": 3, "speaker": "Woman", "prompt": "How do I contact customer service?", "options": {"A": "Yes, you're allowed to do that.", "B": "Use the convenient chat feature.", "C": "No, I don't mind.", "D": "They provide good service."}, "key": "B", "audio": "../resources/audio/tests/student-1/listening/question-response/Listening1_Question Response_Question3.ogg"}, {"n": 4, "speaker": "Woman", "prompt": "I'm afraid I'm not available this evening.", "options": {"A": "Oh, that's too early.", "B": "How about tomorrow night then?", "C": "She arrived this afternoon.", "D": "No, that's not necessary."}, "key": "B", "audio": "../resources/audio/tests/student-1/listening/question-response/Listening1_Question Response_Question4.ogg"}, {"n": 5, "speaker": "Man", "prompt": "Isn't the post office open today?", "options": {"A": "No, it's my package.", "B": "It's just around the corner!", "C": "I think he's come home already.", "D": "Let's check the schedule online."}, "key": "D", "audio": "../resources/audio/tests/student-1/listening/question-response/Listening1_Question Response_Question5.ogg"}, {"n": 6, "speaker": "Woman", "prompt": "If you need me, just text.", "options": {"A": "I can help you with that.", "B": "You don't need any more information.", "C": "You have a lot of questions, don't you?", "D": "You haven't given me your number yet."}, "key": "D", "audio": "../resources/audio/tests/student-1/listening/question-response/Listening1_Question Response_Question6.ogg"}, {"n": 7, "speaker": "Woman", "prompt": "So the store is open for business all weekend?", "options": {"A": "Yes, there is a major power outage.", "B": "Yes, it's under renovation.", "C": "Yes, it's closed all day on Sunday.", "D": "Yes, they're having a huge sale."}, "key": "D", "audio": "../resources/audio/tests/student-1/listening/question-response/Listening1_Question Response_Question7.ogg"}, {"n": 8, "speaker": "Man", "prompt": "Did you attend the seminar?", "options": {"A": "I overslept.", "B": "No, not very well.", "C": "Have you asked your professor?", "D": "I forgot to look."}, "key": "A", "audio": "../resources/audio/tests/student-1/listening/question-response/Listening1_Question Response_Question8.ogg"}]}, {"id": "T1_2", "test": 1, "src": "Full-Length 1", "module": 2, "items": [{"n": 1, "speaker": "Woman", "prompt": "Who is the new manager?", "options": {"A": "She started last week.", "B": "I’m unsure, but I can find out.", "C": "Let's welcome the new manager.", "D": "The position has been filled."}, "key": "B", "audio": "../resources/audio/tests/student-1/listening/question-response/Listening2_Question Response_Question1.ogg"}, {"n": 2, "speaker": "Man", "prompt": "When is the due date for the report?", "options": {"A": "Please wait while I look that up.", "B": "Give me some dates.", "C": "No, I have another due date.", "D": "Yes, that's correct."}, "key": "A", "audio": "../resources/audio/tests/student-1/listening/question-response/Listening2_Question Response_Question2.ogg"}, {"n": 3, "speaker": "Man", "prompt": "I’m going to get some groceries.", "options": {"A": "Every Wednesday.", "B": "In aisle 4.", "C": "The cinema is not open today.", "D": "Let’s go together."}, "key": "D", "audio": "../resources/audio/tests/student-1/listening/question-response/Listening2_Question Response_Question3.ogg"}, {"n": 4, "speaker": "Woman", "prompt": "Would you like a copy of my notes?", "options": {"A": "The research facility.", "B": "That would be great.", "C": "The break is in an hour.", "D": "Two bullet points."}, "key": "B", "audio": "../resources/audio/tests/student-1/listening/question-response/Listening2_Question Response_Question4.ogg"}, {"n": 5, "speaker": "Man", "prompt": "Sami and Layla are on their way to the café.", "options": {"A": "Should we join them?", "B": "Did you like the concert?", "C": "Yesterday evening.", "D": "The best coffee."}, "key": "A", "audio": "../resources/audio/tests/student-1/listening/question-response/Listening2_Question Response_Question5.ogg"}, {"n": 6, "speaker": "Woman", "prompt": "I'd like to hear your thoughts on the job candidates.", "options": {"A": "I'm revising my résumé.", "B": "I’ll set up a meeting for us to talk.", "C": "She just got a promotion.", "D": "Yes, the training is complete."}, "key": "B", "audio": "../resources/audio/tests/student-1/listening/question-response/Listening2_Question Response_Question6.ogg"}, {"n": 7, "speaker": "Woman", "prompt": "How much does expedited shipping cost?", "options": {"A": "It's one of many.", "B": "Twice last week.", "C": "We don't offer that.", "D": "I'd like the bill, please."}, "key": "C", "audio": "../resources/audio/tests/student-1/listening/question-response/Listening2_Question Response_Question7.ogg"}, {"n": 8, "speaker": "Man", "prompt": "If you need more information, contact Ms. Lee.", "options": {"A": "I can help with that.", "B": "What is her role in the company?", "C": "You ask a lot of questions.", "D": "And whom should I contact?"}, "key": "B", "audio": "../resources/audio/tests/student-1/listening/question-response/Listening2_Question Response_Question8.ogg"}]}, {"id": "T2_1", "test": 2, "src": "Full-Length 2", "module": 1, "items": [{"n": 1, "speaker": "Man", "prompt": "How can I get this light to work?", "options": {"A": "The lighter one is over there.", "B": "There's a switch on the back wall.", "C": "The side door is open.", "D": "I prefer to work at home."}, "key": "B", "audio": "../resources/audio/tests/student-2/listening/question-response/Listening1_Question Response_Question1.ogg"}, {"n": 2, "speaker": "Woman", "prompt": "I'm not available tomorrow.", "options": {"A": "Let's try to get there early.", "B": "What's a better day for you?", "C": "It's not on my schedule either.", "D": "I was in a meeting last night."}, "key": "B", "audio": "../resources/audio/tests/student-2/listening/question-response/Listening1_Question Response_Question2.ogg"}, {"n": 3, "speaker": "Man", "prompt": "The campus talent contest will be held next Saturday evening.", "options": {"A": "I can hold that for you.", "B": "Stage lighting is usually very hot.", "C": "My roommate is a talented basketball player.", "D": "Do you know who the judges will be?"}, "key": "D", "audio": "../resources/audio/tests/student-2/listening/question-response/Listening1_Question Response_Question3.ogg"}, {"n": 4, "speaker": "Man", "prompt": "What time do I need to pick up Michael from the train station?", "options": {"A": "Don't worry about it--I'll get him.", "B": "He said he prefers the window seat.", "C": "The station now has a snack shop.", "D": "There's road construction near the entrance."}, "key": "A", "audio": "../resources/audio/tests/student-2/listening/question-response/Listening1_Question Response_Question4.ogg"}, {"n": 5, "speaker": "Woman", "prompt": "Isn't the grocery store open late tonight?", "options": {"A": "Yes, it is.", "B": "No, shopping takes time.", "C": "It's next to the store.", "D": "I'd rather not."}, "key": "A", "audio": "../resources/audio/tests/student-2/listening/question-response/Listening1_Question Response_Question5.ogg"}, {"n": 6, "speaker": "Woman", "prompt": "Did you bring the identification documents?", "options": {"A": "They are in the blue folder.", "B": "Who can identify them?", "C": "Both can be done.", "D": "Yes, I would."}, "key": "A", "audio": "../resources/audio/tests/student-2/listening/question-response/Listening1_Question Response_Question6.ogg"}, {"n": 7, "speaker": "Man", "prompt": "Wait, isn't the concert tomorrow night?", "options": {"A": "No, it's tonight.", "B": "No, I can't wait.", "C": "Yes, I would.", "D": "Yes, that's fine."}, "key": "A", "audio": "../resources/audio/tests/student-2/listening/question-response/Listening1_Question Response_Question7.ogg"}, {"n": 8, "speaker": "Woman", "prompt": "I'm not available this afternoon.", "options": {"A": "So am I.", "B": "It takes a while.", "C": "I didn't mean it.", "D": "Well, I understand."}, "key": "D", "audio": "../resources/audio/tests/student-2/listening/question-response/Listening1_Question Response_Question8.ogg"}]}, {"id": "T2_2", "test": 2, "src": "Full-Length 2", "module": 2, "items": [{"n": 1, "speaker": "Woman", "prompt": "Who is responsible for the project timeline?", "options": {"A": "I do.", "B": "I'm not sure.", "C": "A few unexpected delays.", "D": "It stays on track."}, "key": "B", "audio": "../resources/audio/tests/student-2/listening/question-response/Listening2_Question Response_Question1.ogg"}, {"n": 2, "speaker": "Woman", "prompt": "Why did the team meeting get canceled?", "options": {"A": "Two days ago.", "B": "Meeting attendees.", "C": "Actually, it was rescheduled.", "D": "How about another time?"}, "key": "C", "audio": "../resources/audio/tests/student-2/listening/question-response/Listening2_Question Response_Question2.ogg"}, {"n": 3, "speaker": "Man", "prompt": "Can you assist me with my science report?", "options": {"A": "Let me know what you think.", "B": "You're very kind.", "C": "What exactly do you need help with?", "D": "It doesn't matter."}, "key": "C", "audio": "../resources/audio/tests/student-2/listening/question-response/Listening2_Question Response_Question3.ogg"}, {"n": 4, "speaker": "Man", "prompt": "I'm not sure about the current plan.", "options": {"A": "That's unfortunate.", "B": "Sure, I can.", "C": "I think you have it.", "D": "No, it's planned."}, "key": "A", "audio": "../resources/audio/tests/student-2/listening/question-response/Listening2_Question Response_Question4.ogg"}, {"n": 5, "speaker": "Man", "prompt": "If you need help, ask Ms. Johnson.", "options": {"A": "Either is fine by me.", "B": "Happy to help.", "C": "That's what I'll do.", "D": "I'm available."}, "key": "C", "audio": "../resources/audio/tests/student-2/listening/question-response/Listening2_Question Response_Question5.ogg"}, {"n": 6, "speaker": "Woman", "prompt": "What time does the event start?", "options": {"A": "In the party room.", "B": "At 1 p.m.", "C": "It's crowded.", "D": "Event coordinators."}, "key": "B", "audio": "../resources/audio/tests/student-2/listening/question-response/Listening2_Question Response_Question6.ogg"}, {"n": 7, "speaker": "Man", "prompt": "Who is hosting the party tonight?", "options": {"A": "The marketing team is.", "B": "It's tonight.", "C": "I can't help it.", "D": "It's good for two days."}, "key": "A", "audio": "../resources/audio/tests/student-2/listening/question-response/Listening2_Question Response_Question7.ogg"}, {"n": 8, "speaker": "Man", "prompt": "Let's go hiking this weekend.", "options": {"A": "Maybe it is.", "B": "Why not this weekend instead?", "C": "Have you checked the weather?", "D": "Are you busy?"}, "key": "C", "audio": "../resources/audio/tests/student-2/listening/question-response/Listening2_Question Response_Question8.ogg"}]}, {"id": "T3_1", "test": 3, "src": "Teacher Resources 1", "module": 1, "items": [{"n": 1, "speaker": "Man", "prompt": "Does the building have a parking garage?", "options": {"A": "No, I haven't received it yet.", "B": "Yes, it’s just around the corner.", "C": "Let's walk to the park.", "D": "Several times a month."}, "key": "B", "audio": "../resources/audio/tests/teacher-1/listening/listen-and-response/Listening1_Listen_Response_Question1.mp3"}, {"n": 2, "speaker": "Woman", "prompt": "Didn't you book a trip to Australia?", "options": {"A": "No, the airport is on the right.", "B": "Yes, I loved that book!", "C": "I'd be happy to sell tickets for the fundraiser.", "D": "I'm going to New Zealand instead."}, "key": "D", "audio": "../resources/audio/tests/teacher-1/listening/listen-and-response/Listening1_Listen_Response_Question2.mp3"}, {"n": 3, "speaker": "Woman", "prompt": "Who's conducting the safety training?", "options": {"A": "Elizabeth would be the person to ask.", "B": "We'll be gathering in the main conference room.", "C": "Did Robert place the food order?", "D": "The train station closes at midnight."}, "key": "A", "audio": "../resources/audio/tests/teacher-1/listening/listen-and-response/Listening1_Listen_Response_Question3.mp3"}, {"n": 4, "speaker": "Man", "prompt": "Can I purchase this shirt in a different size?", "options": {"A": "Are you looking for the same color?", "B": "Yes, we stock a variety of styles of pants.", "C": "All of our stores are open on Sundays.", "D": "The store will be remodeled this summer."}, "key": "A", "audio": "../resources/audio/tests/teacher-1/listening/listen-and-response/Listening1_Listen_Response_Question4.mp3"}, {"n": 5, "speaker": "Man", "prompt": "Why did Sharon relocate to Belfast?", "options": {"A": "The suitcases can be stored overhead.", "B": "Because I have a doctor's appointment.", "C": "I know you have some vacation time coming up.", "D": "She was offered a new role."}, "key": "D", "audio": "../resources/audio/tests/teacher-1/listening/listen-and-response/Listening1_Listen_Response_Question5.mp3"}, {"n": 6, "speaker": "Woman", "prompt": "How much do these watches cost?", "options": {"A": "Did you watch the game yesterday?", "B": "They start at a hundred dollars.", "C": "These models feature a new display.", "D": "The admission fee has gone up by twenty dollars."}, "key": "B", "audio": "../resources/audio/tests/teacher-1/listening/listen-and-response/Listening1_Listen_Response_Question6.mp3"}, {"n": 7, "speaker": "Woman", "prompt": "Where can I buy a charger for my phone?", "options": {"A": "Battery recycling is available on Saturdays.", "B": "The cost of those phones just went up.", "C": "There's a shopping center a few minutes from here.", "D": "The cashier charged me too much."}, "key": "C", "audio": "../resources/audio/tests/teacher-1/listening/listen-and-response/Listening1_Listen_Response_Question7.mp3"}, {"n": 8, "speaker": "Man", "prompt": "What streaming services do you like to watch shows on?", "options": {"A": "I don't have a cleaning service.", "B": "I'm too busy to watch anything right now.", "C": "The stream runs behind the house.", "D": "The magazine subscription is expensive."}, "key": "B", "audio": "../resources/audio/tests/teacher-1/listening/listen-and-response/Listening1_Listen_Response_Question8.mp3"}]}, {"id": "T3_2", "test": 3, "src": "Teacher Resources 1", "module": 2, "items": [{"n": 1, "speaker": "Man", "prompt": "Don't you have class right now?", "options": {"A": "My professor is out this week.", "B": "The syllabus was just posted.", "C": "Yes, it's in my backpack.", "D": "I don't think I received one."}, "key": "A", "audio": "../resources/audio/tests/teacher-1/listening/listen-and-response/Listening2_Listen_Response_Question1.mp3"}, {"n": 2, "speaker": "Woman", "prompt": "Have you met our new neighbor?", "options": {"A": "It's a quiet neighborhood.", "B": "I haven’t yet.", "C": "Yes, I'll drop it off tomorrow.", "D": "Not usually at this time of day."}, "key": "B", "audio": "../resources/audio/tests/teacher-1/listening/listen-and-response/Listening2_Listen_Response_Question2.mp3"}, {"n": 3, "speaker": "Woman", "prompt": "Why does my computer keep shutting down?", "options": {"A": "Sure, you can borrow my charging cord.", "B": "The door should remain shut and locked.", "C": "Because the schedule was changed at the last minute.", "D": "Sounds like it needs to be repaired."}, "key": "D", "audio": "../resources/audio/tests/teacher-1/listening/listen-and-response/Listening2_Listen_Response_Question3.mp3"}, {"n": 4, "speaker": "Man", "prompt": "Why didn't Andy come to the business dinner?", "options": {"A": "I just met his assistant.", "B": "The cafeteria closes at 2 o'clock.", "C": "He’s working late tonight.", "D": "Because I lost mine."}, "key": "C", "audio": "../resources/audio/tests/teacher-1/listening/listen-and-response/Listening2_Listen_Response_Question4.mp3"}, {"n": 5, "speaker": "Man", "prompt": "Should we repaint the classrooms in that building?", "options": {"A": "They usually study together.", "B": "The library is past the cafeteria.", "C": "I think it’s time to do it.", "D": "Some new classroom equipment."}, "key": "C", "audio": "../resources/audio/tests/teacher-1/listening/listen-and-response/Listening2_Listen_Response_Question5.mp3"}, {"n": 6, "speaker": "Woman", "prompt": "Would you mind making copies of the syllabus for me?", "options": {"A": "I'll put them on your desk.", "B": "Yes, I'll pass along the message.", "C": "I like that new coffee maker.", "D": "No, the other textbook."}, "key": "A", "audio": "../resources/audio/tests/teacher-1/listening/listen-and-response/Listening2_Listen_Response_Question6.mp3"}, {"n": 7, "speaker": "Woman", "prompt": "You managed to get to the concert, didn't you?", "options": {"A": "I was able to make it to the trade show.", "B": "I do not play any instruments.", "C": "My manager agreed to the new schedule.", "D": "It was a very long drive."}, "key": "D", "audio": "../resources/audio/tests/teacher-1/listening/listen-and-response/Listening2_Listen_Response_Question7.mp3"}, {"n": 8, "speaker": "Man", "prompt": "Does the restaurant use organic vegetables?", "options": {"A": "The menu features two fish entrées.", "B": "It depends on the season.", "C" he library open now?", "options": {"A": "Yes, until nine p.m.", "B": "Maybe last week.", "C": "Every book.", "D": "No, dinner is at eight p.m."}, "key": "A", "audio": "../resources/audio/tests/teacher-4/listening/listen-and-response/Listening1_Listen_Response_Question1.ogg"}, {"n": 2, "speaker": "Woman", "prompt": "Could you help me organize these files?", "options": {"A": "Sure, I can.", "B": "The calendar is current.", "C": "Yes, on the left.", "D": "The kitchen is large."}, "key": "A", "audio": "../resources/audio/tests/teacher-4/listening/listen-and-response/Listening1_Listen_Response_Question2.ogg"}, {"n": 3, "speaker": "Man", "prompt": "It looks like you didn't finish the slides for the presentation.", "options": {"A": "Yes, I agree with the manager.", "B": "The concert was fantastic.", "C": "Sorry—I forgot.", "D": "Yes, I'll leave tomorrow evening."}, "key": "C", "audio": "../resources/audio/tests/teacher-4/listening/listen-and-response/Listening1_Listen_Response_Question3.ogg"}, {"n": 4, "speaker": "Woman", "prompt": "It's quite warm, isn't it?", "options": {"A": "I haven't had a chance to check the schedule.", "B": "It's not in the budget for this year.", "C": "The hallway lights are out again.", "D": "Especially for this time of year."}, "key": "D", "audio": "../resources/audio/tests/teacher-4/listening/listen-and-response/Listening1_Listen_Response_Question4.ogg"}, {"n": 5, "speaker": "Man", "prompt": "Will you be able to meet the deadline for your research paper?", "options": {"A": "Sure, I'll call them tomorrow.", "B": "Sorry to hear that.", "C": "I'm on track to finish on time.", "D": "Not such a good idea."}, "key": "C", "audio": "../resources/audio/tests/teacher-4/listening/listen-and-response/Listening1_Listen_Response_Question5.ogg"}, {"n": 6, "speaker": "Woman", "prompt": "When is your job interview?", "options": {"A": "It will be in the conference room.", "B": "It's been rescheduled to Monday morning.", "C": "I'll do that next time.", "D": "We went out for lunch afterward."}, "key": "B", "audio": "../resources/audio/tests/teacher-4/listening/listen-and-response/Listening1_Listen_Response_Question6.ogg"}, {"n": 7, "speaker": "Man", "prompt": "I'm having trouble resetting my password.", "options": {"A": "Let me find the instructions for you.", "B": "I can't attend tonight.", "C": "I don't know how many.", "D": "Set the documents on the table."}, "key": "A", "audio": "../resources/audio/tests/teacher-4/listening/listen-and-response/Listening1_Listen_Response_Question7.ogg"}, {"n": 8, "speaker": "Woman", "prompt": "I can't find the invoice for last month's catering order.", "options": {"A": "Did you check the file folder?", "B": "Two copies of the billing statement.", "C": "Didn't they offer to write a review?", "D": "A month from now."}, "key": "A", "audio": "../resources/audio/tests/teacher-4/listening/listen-and-response/Listening1_Listen_Response_Question8.ogg"}]}, {"id": "T6_2", "test": 6, "src": "Teacher Resources 4", "module": 2, "items": [{"n": 1, "speaker": "Man", "prompt": "Would you mind closing the window?", "options": {"A": "Sure, I'll call tomorrow.", "B": "Check under the table.", "C": "No problem.", "D": "Closed on Mondays."}, "key": "C", "audio": "../resources/audio/tests/teacher-4/listening/listen-and-response/Listening2_Listen_Response_Question1.ogg"}, {"n": 2, "speaker": "Woman", "prompt": "The seminar meets at eight thirty a.m. on Wednesdays.", "options": {"A": "Nearly 90 minutes.", "B": "Thank you for reminding me.", "C": "The bookstore opens at noon on Sundays.", "D": "About 200 faculty members."}, "key": "B", "audio": "../resources/audio/tests/teacher-4/listening/listen-and-response/Listening2_Listen_Response_Question2.ogg"}, {"n": 3, "speaker": "Man", "prompt": "Have you created the syllabus for the art history course?", "options": {"A": "Sure, I'll check them.", "B": "No, the artwork is being shipped.", "C": "I'll have time tomorrow morning.", "D": "The professor called me back."}, "ke const KEY = 'listenRespond_v1';
// Cause codes derived from the Listening Playbook (three checks + trap list). Not yet data-driven.
const CAUSES = [
 ['', '— pick the cause —', ''],
 ['L1 Missed words', 'L1 Missed words', 'Did I mishear or miss a key word (a number, a name, a negation)?'],
 ['L2 Wrong speech act', 'L2 Wrong speech act', 'Was it a question, a suggestion, an offer, or a complaint, and did my answer fit that?'],
 ['L3 Grammar/form mismatch', 'L3 Grammar/form mismatch', 'Does the answer fit the question word and form (where→place, when→time, yes/no, tense)?'],
 ['L4 Echo / sound-alike', 'L4 Echo / sound-alike', 'Did I choose it because it repeated a word I heard, without answering the point?'],
 ['L5 Missed implied meaning', 'L5 Missed implied meaning', 'Was the real answer indirect (polite refusal, suggestion, "I\'m not sure, but…")?'],
 ['L6 Stopped at first fit', 'L6 Stopped at first fit', 'Did I stop at the first option that sounded fine without checking the other three?'],
 ['Changed answer', 'Changed answer', 'Did I switch from the right answer? What made me switch?'],
 ['Guessed', 'Guessed', 'No idea. Which of the three checks could have eliminated options?'],
 ['Careless', 'Careless', 'Knew it, mis-clicked or rushed.'],
 ['Other', 'Other', 'Explain in the note.']
];
const CAUSE_HINT = Object.fromEntries(CAUSES.map(c => [c[0], c[2]]));
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S = (() => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } })();
S.mods = S.mods || {}; S.mode = S.mode || 'exam';
const save = () => localStorage.setItem(KEY, JSON.stringify(S));
const mod = id => DATA.find(m => m.id === id);
const st = id => S.mods[id] || (S.mods[id] = {ans: [], ms: [], replays: [], cause: {}, note: {}, done: false, secs: 0});
const score = id => { const m = mod(id), s = S.mods[id]; return s ? m.items.reduce((a, it, i) => a + (s.ans[i] === it.key ? 1 : 0), 0) : 0; };
const fmt = s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
let cur = (S.cur && mod(S.cur)) ? S.cur : DATA[0].id;
let view = 'intro', qi = 0, audio = null, optionsShown = false, qStart = 0, modStart = 0, replaysNow = 0, picked = null, tick = null;

function stopAudio() { if (audio) { audio.pause(); audio.onended = audio.onerror = null; audio = null; } }
function startTimer() { clearInterval(tick); tick = setInterval(() => { if (view === 'q') $('#timer').textContent = fmt(st(cur).secs + Math.floor((Date.now() - modStart) / 1000)); }, 500); }

function renderNav() {
  let h = '', lastTest = 0;
  DATA.forEach(m => {
    if (m.test !== lastTest) { lastTest = m.test; h += `<div class="group">Test ${m.test} · ${esc(m.src)}</div>`; }
    const s = S.mods[m.id], done = s && s.done;
    h += `<button class="mod ${m.id === cur ? 'active' : ''}" data-id="${m.id}"><span>Module ${m.module}</span><span class="badge ${done ? 'done' : ''}">${done ? score(m.id) + '/8' : (s && s.ans.length ? s.ans.length + '/8…' : '—')}</span></button>`;
  });
  $('#nav').innerHTML = h;
  document.querySelectorAll('.mod').forEach(b => b.onclick = () => open(b.dataset.id));
  const dm = DATA.filter(m => S.mods[m.id] && S.mods[m.id].done);
  const tot = dm.reduce((a, m) => a + score(m.id), 0);
  $('#totals').textContent = `Completed: ${dm.length}/14 modules · ${tot}/${dm.length * 8}${dm.length ? ' (' + Math.round(100 * tot / (dm.length * 8)) + '%)' : ''}`;
}

function open(id) {
  stopAudio(); cur = id; S.cur = id; save();
  const s = S.mods[id];
  view = s && s.done ? 'review' : 'intro';
  render();
}

function render() {
  const m = mod(cur); renderNav();
  $('#title').textContent = `Test ${m.test} · ${m.src} · Module ${m.module}`;
  $('#mode').value = S.mode;
  const s = S.mods[cur];
  $('#timer').textContent = fmt(s ? s.secs : 0);
  if (view === 'intro') renderIntro(); else if (view === 'q') renderQ(); else renderReview();
}

function dots(m, s, active) {
  return '<div class="prog">' + m.items.map((it, i) => {
    let c = ''; if (s && s.done) c = s.ans[i] === it.key ? 'ok' : 'bad'; else if (s && i < s.ans.length) c = 'on'; else if (i === active) c = 'on';
    return `<div class="dot ${c}"></div>`; }).join('') + '</div>';
}

function renderIntro() {
  const m = mod(cur), s = S.mods[cur], n = s ? s.ans.length : 0;
  $('#view').innerHTML = `<div class="card"><h2>Listen and Choose a Response</h2>
    <p>You will hear ${m.items.length} short spoken statements or questions. After each one, choose the best response from four options.</p>
    <p class="muted">${S.mode === 'exam' ? 'Exam mode: each audio plays once, the options appear when it ends, and you cannot go back.' : 'Practice mode: options are visible, you can replay the audio and go back.'} Turn the volume up before you start.</p>
    <button class="primary" id="startBtn">${n ? 'Resume at question ' + (n + 1) : 'Start module'}</button></div>`;
  $('#startBtn').onclick = () => { qi = n; view = 'q'; modStart = Date.now(); startTimer(); render(); };
}

function playQ() {
  const m = mod(cur), it = m.items[qi];
  stopAudio();
  const box = $('#listen');
  audio = new Audio(encodeURI(it.audio));
  audio.onended = () => { optionsShown = S.mode === 'exam' ? true : optionsShown; qStart = Date.now(); box.innerHTML = '<span class="ico">✓</span><span>Audio finished.</span>'; showOpts(); };
  audio.onerror = () => { box.className = 'listen err'; box.innerHTML = `<span class="ico">⚠</span><span>Audio could not be loaded: <code>${esc(it.audio)}</code>. Use Arc or Chrome, and check the file exists.</span>`; };
  box.className = 'listen'; box.innerHTML = '<span class="ico">🔊</span><span>Playing…</span>';
  const a = audio;
  a.play().catch(e => {
    if (audio !== a || e.name !== 'NotAllowedError') return;   // ignore plays interrupted by leaving the question
    box.innerHTML = '<span class="ico">▶</span><span>Your browser blocked autoplay. </span><button id="manual" class="primary">Play audio</button>';
    box.querySelector('#manual').onclick = () => { box.innerHTML = '<span class="ico">🔊</span><span>Playing…</span>'; a.play(); };
  });
}

function showOpts() { const o = $('#opts'); if (o) { o.hidden = false; } const b = $('#nextBtn'); if (b) b.hidden = false; }

function renderQ() {
  const m = mod(cur), s = st(cur), it = m.items[qi], exam = S.mode === 'exam';
  picked = null; replaysNow = 0; optionsShown = !exam; qStart = Date.now();
  $('#view').innerHTML = `<div class="card">${dots(m, s, qi)}
    <div class="qhead"><span class="qnum">Question ${qi + 1} of ${m.items.length}</span></div>
    <div class="listen" id="listen"></div>
    <div id="opts" ${exam ? 'hidden' : ''}>${['A', 'B', 'C', 'D'].map(l => `<label class="opt"><input type="radio" name="o" value="${l}"><span class="l">${l}</span><span>${esc(it.options[l])}</span></label>`).join('')}</div>
    <div class="row" style="margin-top:14px">
      ${exam ? '' : `<button id="back" ${qi === 0 ? 'disabled' : ''}>← Back</button><button id="replay">↻ Replay</button>`}
      <button class="primary" id="nextBtn" disabled ${exam ? 'hidden' : ''}>${qi === m.items.length - 1 ? 'Finish module' : 'Next →'}</button>
    </div></div>`;
  document.querySelectorAll('input[name=o]').forEach(r => r.onchange = () => {
    picked = r.value; $('#nextBtn').disabled = false;
    document.querySelectorAll('.opt').forEach(o => o.classList.toggle('sel', o.querySelector('input').checked)); });
  $('#nextBtn').onclick = next;
  if (!exam) { $('#replay').onclick = () => { replaysNow++; playQ(); }; const bk = $('#back'); if (bk) bk.onclick = () => { stopAudio(); s.secs += Math.floor((Date.now() - modStart) / 1000); modStart = Date.now(); qi--; save(); renderQ(); }; }
  // prefill when going back
  if (s.ans[qi]) { const r = document.querySelector(`input[value=${s.ans[qi]}]`); if (r) { r.checked = true; r.onchange(); } }
  playQ();
}

function next() {
  const m = mod(cur), s = st(cur); if (!picked) return;
  stopAudio();
  s.ans[qi] = picked; s.ms[qi] = Math.max(0, Date.now() - qStart); s.replays[qi] = (s.replays[qi] || 0) + replaysNow;
  if (qi < m.items.length - 1) { qi++; save(); renderQ(); renderNav(); }
  else {
    s.secs += Math.floor((Date.now() - modStart) / 1000); s.done = true; s.date = new Date().toISOString().slice(0, 16).replace('T', ' ');
    clearInterval(tick); save(); view = 'review'; render();
  }
}

function renderReview() {
  const m = mod(cur), s = S.mods[cur];
  const sc = score(cur);
  const miss = m.items.filter((it, i) => s.ans[i] !== it.key).length;
  let h = `<div class="card"><div class="score">${sc} / ${m.items.length}</div><div class="muted">${miss ? miss + ' to review' : 'All correct'} · time ${fmt(s.secs)} · ${esc(s.date || '')}</div>${dots(m, s, -1)}</div>`;
  m.items.forEach((it, i) => {
    const a = s.ans[i], ok = a === it.key;
    h += `<div class="card"><div class="qhead"><span class="qnum">Q${i + 1}</span><span class="tag ${ok ? 'ok' : 'bad'}">${ok ? 'Correct' : 'Wrong'}</span>
      <span>decision ${(s.ms[i] / 1000).toFixed(1)}s${s.replays[i] ? ' · ' + s.replays[i] + ' replay(s)' : ''}</span><button data-play="${i}" style="margin-left:auto">🔊 Play</button></div>
      <div class="prompt">${esc(it.speaker)}: ${esc(it.prompt)}</div>
      ${['A', 'B', 'C', 'D'].map(l => `<div class="opt static ${l === it.key ? 'right' : (l === a ? 'wrong' : '')}"><span class="l">${l}</span><span>${esc(it.options[l])}${l === it.key ? ' ✓' : ''}${l === a && !ok ? ' ← your answer' : ''}</span></div>`).join('')}
      ${ok ? '' : `<div class="fb"><label>Why did I miss it?
        <select data-cause="${i}">${CAUSES.map(c => `<option value="${esc(c[0])}" ${(s.cause[i] || '') === c[0] ? 'selected' : ''}>${esc(c[1])}</option>`).join('')}${s.cause[i] && !CAUSE_HINT.hasOwnProperty(s.cause[i]) ? `<option selected>${esc(s.cause[i])} (older)</option>` : ''}</select></label>
        <div class="hint" id="hint${i}">${esc(CAUSE_HINT[s.cause[i] || ''] || '')}</div>
        <textarea data-note="${i}" placeholder="What did I hear, and what exactly led me to the wrong option?">${esc(s.note[i] || '')}</textarea></div>`}</div>`;
  });
  $('#view').innerHTML = h;
  document.querySelectorAll('[data-play]').forEach(b => b.onclick = () => { stopAudio(); audio = new Audio(encodeURI(m.items[+b.dataset.play].audio)); audio.play(); });
  document.querySelectorAll('[data-cause]').forEach(x => x.onchange = () => { s.cause[x.dataset.cause] = x.value; $('#hint' + x.dataset.cause).textContent = CAUSE_HINT[x.value] || ''; save(); });
  document.querySelectorAll('[data-note]').forEach(x => x.oninput = () => { s.note[x.dataset.note] = x.value; save(); });
}

function exportMd() {
  const pipe = t => String(t == null ? '' : t).replace(/\|/g, '\\|').replace(/\n/g, ' ');
  const dm = DATA.filter(m => S.mods[m.id] && S.mods[m.id].done);
  const tot = dm.reduce((a, m) => a + score(m.id), 0);
  let o = `# Listening Type A — Listen and Choose a Response (exported ${new Date().toISOString().slice(0, 16).replace('T', ' ')})\n\nTotal: ${tot}/${dm.length * 8} across ${dm.length}/14 modules · mode at export: ${S.mode}\n\n| Module | Score | Time | Avg decision | Replays |\n|---|---|---|---|---|\n`;
  dm.forEach(m => { const s = S.mods[m.id]; const avg = s.ms.reduce((a, b) => a + b, 0) / s.ms.length / 1000; o += `| Test ${m.test} M${m.module} (${m.src}) | ${score(m.id)}/8 | ${fmt(s.secs)} | ${avg.toFixed(1)}s | ${s.replays.reduce((a, b) => a + (b || 0), 0)} |\n`; });
  let any = false, rows = '';
  dm.forEach(m => { const s = S.mods[m.id]; m.items.forEach((it, i) => { if (s.ans[i] !== it.key) { any = true;
    rows += `| T${m.test} M${m.module} Q${i + 1} | ${pipe(it.speaker + ': ' + it.prompt)} | ${s.ans[i]}. ${pipe(it.options[s.ans[i]])} | ${it.key}. ${pipe(it.options[it.key])} | ${pipe(s.cause[i] || '')} | ${pipe(s.note[i] || '')} |\n`; } }); });
  o += any ? `\n## Misses\n\n| Item | Prompt (audio) | My answer | Key | Cause | Note |\n|---|---|---|---|---|---|\n${rows}` : '\nNo misses recorded.\n';
  $('#exportText').value = o; $('#exportbox').hidden = false; $('#exportText').scrollIntoView({behavior: 'smooth'});
}

$('#mode').onchange = e => { S.mode = e.target.value; save(); if (view === 'q') { stopAudio(); renderQ(); } else render(); };
$('#resetBtn').onclick = () => { if (confirm('Reset this module? Your answers and notes for it will be deleted.')) { stopAudio(); delete S.mods[cur]; save(); clearInterval(tick); view = 'intro'; qi = 0; render(); } };
$('#exportBtn').onclick = exportMd;
$('#copyBtn').onclick = () => { $('#exportText').select(); document.execCommand('copy'); $('#copied').textContent = 'Copied'; setTimeout(() => $('#copied').textContent = '', 1500); };
document.addEventListener('keydown', e => {
  if (view !== 'q' || /TEXTAREA|SELECT/.test(e.target.tagName)) return;
  const k = e.key.toUpperCase(); const opts = $('#opts');
  if ('ABCD'.includes(k) && k.length === 1 && opts && !opts.hidden) { const r = document.querySelector(`input[value=${k}]`); if (r) { r.checked = true; r.onchange(); } }
  else if (e.key === 'Enter' && $('#nextBtn') && !$('#nextBtn').disabled && !$('#nextBtn').hidden) next();
});
open(cur);
</script></body></html>
