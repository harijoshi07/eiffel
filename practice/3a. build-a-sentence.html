<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TOEFL Writing — Build a Sentence</title>
<style>
:root{--bg:#f7f2ea;--card:#fffdf9;--ink:#2d2a26;--muted:#8a8178;--line:#e6ddd0;--terra:#c46a4a;--terra-soft:#f3e0d6;--sage:#7d9a7e;--sage-soft:#e2ebe2;--red:#b5483a;--red-soft:#f6dcd7;--amber-soft:#f8ecd0;--amber:#8a6a1d}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.6}
.wrap{display:grid;grid-template-columns:270px 1fr;min-height:100vh}
aside{background:var(--card);border-right:1px solid var(--line);padding:24px 18px;position:sticky;top:0;height:100vh;overflow:auto}
h1{font-size:18px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px}
.group{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 0 6px}
.mod{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:0;padding:8px 10px;border-radius:10px;cursor:pointer;color:var(--ink);font:inherit;text-align:left}
.mod:hover{background:var(--bg)}.mod.active{background:var(--terra-soft)}
.badge{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--line);color:var(--muted)}
.badge.done{background:var(--sage-soft);color:#3f6143}.badge.run{background:var(--amber-soft);color:var(--amber)}
.totals{margin-top:22px;font-size:13px;color:var(--muted)}
main{padding:28px 36px;max-width:900px;width:100%}
.bar{position:sticky;top:0;z-index:5;background:rgba(247,242,234,.94);backdrop-filter:blur(6px);display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--line);margin-bottom:22px}
.bar .title{font-weight:600;margin-right:auto;font-size:15px}
.timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;min-width:56px}
.timer.low{color:var(--red);font-weight:600}
button,select{font:inherit}
button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 14px;border-radius:999px;cursor:pointer}
button.primary{background:var(--terra);border-color:var(--terra);color:#fff}
button:disabled{opacity:.45;cursor:not-allowed}
button:hover:not(:disabled){filter:brightness(.97)}
select{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px 30px;margin-bottom:16px}
.card h2{margin:0 0 10px;font-size:20px}
.muted{color:var(--muted)}
.prog{display:flex;gap:6px;margin-bottom:18px}
.dot{flex:1;height:8px;border-radius:4px;background:var(--line);cursor:pointer;border:0;padding:0}
.dot.filled{background:#cbbf9e}.dot.cur{background:var(--terra)}.dot.ok{background:var(--sage)}.dot.bad{background:var(--red)}.dot.skip{background:var(--amber-soft)}
.ctx{background:var(--bg);border-radius:12px;padding:12px 16px;margin-bottom:18px}
.ctx .who{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.sent{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:18px;border:1px dashed var(--line);border-radius:14px;background:#fff;min-height:70px;font-size:17px}
.fixed{font-weight:600}
.slot{min-width:64px;height:40px;border:2px dashed #cbbf9e;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;padding:0 10px;background:var(--bg);cursor:pointer;font:inherit}
.slot.over{border-color:var(--terra);background:var(--terra-soft)}
.slot.full{border-style:solid;border-color:var(--terra);background:var(--terra-soft)}
.bank{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 6px;min-height:46px}
.tile{border:1px solid var(--terra);background:#fff;color:var(--ink);border-radius:9px;padding:6px 14px;cursor:grab;font-size:16px}
.tile:hover{background:var(--terra-soft)}
.tile.used{opacity:.25;pointer-events:none}
.nav{display:flex;gap:10px;align-items:center;margin-top:18px}
.nav .sp{flex:1}
.hint{font-size:12.5px;color:var(--muted);margin:6px 0 2px;line-height:1.4}
.qhead{display:flex;gap:10px;align-items:center;margin-bottom:8px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.qnum{font-weight:600;color:var(--terra)}
.tag{font-size:12px;padding:1px 9px;border-radius:999px}
.tag.ok{background:var(--sage-soft);color:#3f6143}.tag.bad{background:var(--red-soft);color:var(--red)}.tag.type{background:var(--line);color:var(--muted)}.tag.skip{background:var(--amber-soft);color:var(--amber)}
.warn{background:var(--amber-soft);color:var(--amber);border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:12px}
.yours,.keyl{padding:10px 14px;border-radius:12px;margin:8px 0;font-size:16.5px}
.yours{background:#fff;border:1px solid var(--line)}
.yours.ok{background:var(--sage-soft);border-color:var(--sage)}
.yours.bad{background:var(--red-soft);border-color:var(--red)}
.keyl{background:var(--sage-soft)}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:block}
.w{padding:0 3px;border-radius:4px}.w.x{background:#f0b9b0;text-decoration:line-through}.w.sp{background:#f0d28a}
.fb{margin-top:10px;font-size:14px;border-top:1px dashed var(--line);padding-top:10px}
.fb select,.fb textarea{width:100%;margin-top:6px;font:inherit;border:1px solid var(--line);border-radius:10px;padding:8px;background:#fff}
.fb textarea{min-height:52px}
.exportbox textarea{width:100%;min-height:260px;font:13px ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}
.score{font-size:34px;font-weight:700;color:var(--terra);line-height:1.1}
.note{font-size:12px;color:var(--muted);margin-top:18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
@media(max-width:900px){.wrap{grid-template-columns:1fr}aside{position:static;height:auto}main{padding:18px}}
</style></head>
<body><div class="wrap">
<aside>
  <h1>Build a Sentence</h1>
  <div class="sub">7 tests · 10 items each · 70 items</div>
  <div id="nav"></div>
  <div class="totals" id="totals"></div>
  <div class="note">Click a tile to place it in the next empty slot, or drag it onto a slot. Click a filled slot to take the tile back. Backspace removes the last tile. ← → move between items.</div>
</aside>
<main>
  <div class="bar">
    <div class="title" id="title"></div>
    <span class="timer" id="timer"></span>
    <span id="barBtns" class="row"></span>
  </div>
  <div id="view"></div>
  <div class="card exportbox" id="exportCard" hidden>
    <h2>Export</h2>
    <p class="muted">Copy this into <code>logs/writing.md</code>.</p>
    <textarea id="exportText" readonly></textarea>
    <div class="row" style="margin-top:10px"><button class="primary" id="copyBtn">Copy</button></div>
  </div>
</main></div>
<script>

b", ""], ["b", ""], ["b", ""], ["b", ""], ["b", ""], ["b", ""], ["f", "?"]], "tiles": ["is", "time of year", "what", "the water", "this", "like", "temperature"], "ans": [2, 0, 3, 6, 5, 4, 1], "key": "What is the water temperature like this time of year?", "flag": null, "scored": true, "keyPrinted": null}, {"n": 7, "ctx": "I need to buy groceries today.", "tpl": [["b", ""], ["b", ""], ["b", ""], ["b", ""], ["b", ""], ["b", ""], ["f", "?"]], "tiles": ["list", "do", "a", "have", "shopping", "you"], "ans": [1, 5, 3, 2, 4, 0], "key": "Do you have a shopping list?", "flag": null, "scored": true, "keyPrinted": null}, {"n": 8, "ctx": "I'll be taking a cooking class this weekend.", "tpl": [["b", ""], ["b", ""], ["b", ""], ["b", ""], ["b", ""], ["f", "?"]], "tiles": ["learn", "what", "will", "you", "recipes"], "ans": [1, 4, 2, 3, 0], "key": "What recipes will you learn?", "flag": null, "scored": true, "keyPrinted": null}, {"n": 9, "ctx": "What did Maria ask you about the book you're reading?", "tpl": [["f", "She"], ["b", ""], ["b", ""], ["b", ""], ["b", ""], ["b", ""], ["b", ""], ["b", ""], ["f", "."]], "tiles": ["she", "wanted", "a copy", "buy", "to know", "could", "where"], "ans": [1, 4, 6, 0, 5, 3, 2], "key": "She wanted to know where she could buy a copy.", "flag": null, "scored": true, "keyPrinted": null}, {"n": 10, "ctx": "How did you prepare for the exam?", "tpl": [["f", "I used"], ["b", ""], ["b", ""], ["b", ""], ["b", ""], ["b", ""], ["f", "."]], "tiles": ["by", "the professor", "that", "the study guide", "was provided", "it"], "ans": [3, 2, 4, 0, 1], "key": "I used the study guide that was provided by the professor.", "flag": null, "scored": true, "keyPrinted": null}]}, {"id": "FL2", "name": "Test 2 · Full-Length 2", "items": [{"n": 1, "ctx": "I need to buy a new laptop.", "tpl": [["b", ""], ["b", ""], ["b", ""], ["b", ""], ["b", ""], ["f", "?"]], "tiles": ["has", "the best", "which", "store", "deals"], "ans": [2, 3, 0, 1, 4], "key": "Which store has the best deals?  "key": "I am curious if he mentioned any specific requirements.", "flag": null, "scored": true, "keyPrinted": null}, {"n": 4, "ctx": "Why are you asking about the new restaurant?", "tpl": [["f", "My"], ["b", ""], ["b", ""], ["b", ""], ["b", ""], ["b", ""], ["b", ""], ["b", ""], ["f", "."]], "tiles": ["is wondering", "it", "when", "is going", "to open", "she", "friend", "Jenna"], "ans": [6, 7, 0, 2, 1, 3, 4], "key": "My friend Jenna is wondering when it is going to open.", "flag": null, "scored": true, "keyPrinted": null}, {"n": 5, "ctx": "Do you know anyone who can give me directions to the Big Tree Bistro?", "tpl": [["b", ""], ["b", ""], ["f", "Sally"], ["b", ""], ["b", ""], ["b", ""], ["b", ""], ["f", "."]], "tiles": ["there", "to get", "how", "think", "I", "where", "knows"], "ans": [4, 3, 6, 2, 1, 0], "key": "I think Sally knows how to get there.", "flag": null, "scored": true, "keyPrinted": null}, {"n": 6, "ctx": "What are your plans for the summer?", "tpl": [["b", ""], ["b", ""], ["b", ""], ["b", ""], ["b", ""], ["b", ""], ["b", ""], ["f", "yet."]], "tiles": ["I", "don't", "I'm", "where", "to do", "going", "know", "what"], "ans": [0, 1, 6, 7, 2, 5, 4], "key": "I don't know what I'm going to do yet.", "flag": null, "scored": true, "keyPrinted": null}, {"n": 7, "ctx": "What did Ruby ask about the new software?", "tpl": [["f", "She wanted"], ["b", ""], ["b", ""], ["b", ""], ["b", ""], ["b", ""], ["b", ""], ["b", ""], ["f", "."]], "tiles": ["help", "however", "if", "it", "to know", "with", "need", "you"], "ans": [4, 2, 7, 6, 0, 5, 3], "key": "She wanted to know if you need help with it.", "flag": null, "scored": true, "keyPrinted": null}, {"n": 8, "ctx": "Why did Gustavo call you this morning?", "tpl": [["f", "He wanted"], ["b", ""], ["b", ""], ["b", ""], ["b", ""], ["b", ""], ["b", ""], ["b", ""], ["f", "."]], "tiles": ["where", "a leak", "could find", "he", "to know", "a plumber", "to fix", "is"], "ans": [4, 0, 3, 2, 5, 6, 1], "key": "He wanted to know where he function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.tests)return s}catch(e){}return {tests:{}}}
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
const T=id=>TESTS.find(t=>t.id===id);
function st(id){
  if(!S.tests[id]){const t=T(id);S.tests[id]={status:"new",ans:t.items.map(it=>it.tpl.filter(x=>x[0]==="b").map(()=>null)),t:t.items.map(()=>0),elapsed:0,limit:0,cause:{},note:{},date:null}}
  return S.tests[id];
}
function norm(s){s=s.toLowerCase().replace(/[\u2019\u2018]/g,"'");s=s.replace(/\s+([?.,!])/g,"$1");return s.replace(/\s+/g," ").trim()}
function compose(it,arr){let k=0,parts=[];for(const [a,v] of it.tpl){if(a==="f")parts.push(v);else{const x=arr[k++];if(x!==null&&x!==undefined)parts.push(it.tiles[x])}}return parts.join(" ")}
function isRight(it,arr){return arr.every(x=>x!==null)&&norm(compose(it,arr))===norm(it.ans_sentence)}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
// key sentence from printed key (display) and grading sentence
for(const t of TESTS)for(const it of t.items){it.ans_sentence=it.key;it.nb=it.tpl.filter(x=>x[0]==="b").length;it.spare=it.tiles.map((_,i)=>i).filter(i=>!it.ans.includes(i));
  it.type=/\?$/.test(it.key)?"Question":"Statement";it.embed=/(know|tell me|wondering|curious|wanted|hoping|whether|if )/i.test(it.key)}
function h(tag,attrs,...kids){const e=document.createElement(tag);for(const k in(attrs||{})){if(k==="class")e.className=attrs[k];else if(k.startsWith("on"))e.addEventListener(k.slice(2),attrs[k]);else if(k==="text")e.textContent=attrs[k];else if(attrs[k]===false||attrs[k]==null)continue;else e.setAttribute(k,attrs[k]===true?"":attrs[k])}for(const c of kids.flat())if(c!=null)e.append(c.nodeType?c:document.createTextNode(c));return e}
const fmt=s=>String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
function score(id){const t=T(id),s=st(id);let r=0,n=0;t.items.forEach((it,i)=>{if(!it.scored)return;n++;if(isRight(it,s.ans[i]))r++});return{r,n}}

function startTick(){
  stop();const s=st(cur.tid);

    s.elapsed++;s.t[cur.i]=(s.t[cur.i]||0)+1;

    else b=h("span",{class:"badge"+(s.status==="run"?" run":"")},s.status==="run"?"in progress":"—");
    nav.append(h("button",{class:"mod"+(t.id===cur.tid?" active":""),onclick:()=>selectTest(t.id)},h("span",{},t.name),b))}
  document.getElementById("totals").textContent=done?`Checked: ${done} of 7 tests · ${R}/${N} (${(100*R/N).toFixed(1)}%)`:"No set checked yet.";
}
function viewIntro(v,s){
  const t=T(cur.tid);
  const sel=h("select",{onchange:e=>{s.limit=+e.target.value;save()}},LIMITS.map(([a,b])=>{const o=h("option",{value:a},b);if(a===s.limit)o.selected=true;return o}));
  v.append(h("div",{class:"card"},h("h2",{},t.name),
    h("p",{},"10 items. Build each sentence from the tiles so it answers or follows the line above it. You can move between items and change answers until you press Finish & check."),
    h("p",{class:"muted"},"Some items have a spare tile that the answer does not use. ETS does not publish the real time limit for this task, so the default here is no limit."),
    h("div",{class:"row"},sel,h("button",{class:"primary",onclick:()=>{s.status="run";s.date=new Date().toISOString();save();render();startTick()}},"Start"))));
}
function viewItem(v,s,t){
  const it=t.items[cur.i],arr=s.ans[cur.i];
  const prog=h("div",{class:"prog"});
  t.items.forEach((x,i)=>{const full=s.ans[i].every(y=>y!==null);prog.append(h("button",{class:"dot "+(i===cur.i?"cur":full?"filled":""),title:"Item "+x.n,onclick:()=>go(i)}))});
  const sent=h("div",{class:"sent"});
  let k=0;
  for(const [a,val] of it.tpl){
    if(a==="f"){sent.append(h("span",{class:"fixed"},val));continue}
    const si=k++,x=arr[si];
    const slot=h("button",{class:"slot"+(x!==null?" full":""),"data-slot":si,onclick:()=>{if(arr[si]!==null){arr[si]=null;save();render0()}}},x!==null?it.tiles[x]:"");
    slot.draggable=x!==null;
    slot.addEventListener("dragstart",e=>{e.dataTransfer.setData("text/plain","s"+si)});
    slot.addEventListener("dragover",e=>{e.preventDefault();slot.classList.add("over")});
    slot.addEventListener("dragleave",()=>slot.classList.remove("over"));
    slot.addEventListener("drop",e=>{e.preventDefault();slot.classList.remove("over");const d=e.dataTransfer.getData("text/plain");
      if(d[0]==="t"){arr[si]=+d.slice(1)}
      else if(d[0]==="s"){const from=+d.slice(1);const tmp=arr[si];arr[si]=arr[from];arr[from]=tmp}
      save();render0()});
    sent.append(slot);
  }
  const bank=h("div",{class:"bank"});
  bank.addEventListener("dragover",e=>e.preventDefault());
  bank.addEventListener("drop",e=>{e.preventDefault();const d=e.dataTransfer.getData("text/plain");if(d[0]==="s"){arr[+d.slice(1)]=null;save();render0()}});
  it.tiles.forEach((tx,i)=>{const used=arr.includes(i);const b=h("button",{class:"tile"+(used?" used":""),onclick:()=>{const e=arr.indexOf(null);if(e>=0){arr[e]=i;save();render0()}}},tx);
    b.draggable=!used;b.addEventListener("dragstart",e=>{e.dataTransfer.setData("text/plain","t"+i)});bank.append(b)});
  const nav=h("div",{class:"nav"},
    h("button",{disabled:cur.i===0,onclick:()=>go(cur.i-1)},"← Back"),
    h("button",{onclick:()=>{arr.fill(null);save();render0()}},"Clear"),h("span",{class:"sp"}),
    cur.i<t.items.length-1?h("button",{class:"primary",onclick:()=>go(cur.i+1)},"Next →"):h("button",{class:"primary",onclick:()=>finish(false)},"Finish & check"));
  v.append(h("div",{class:"card"},prog,
    h("div",{class:"qhead"},h("span",{class:"qnum"},"Item "+it.n+" of 10"),h("span",{},`${it.nb} slots · ${it.tiles.length} tiles`)),
    h("div",{class:"ctx"},h("span",{class:"who"},"They say"),h("div",{},it.ctx)),
    h("span",{class:"lbl"},"Your sentence"),sent,bank,nav));
}
function render0(){const s=st(cur.tid),t=T(cur.tid);const v=document.getElementById("view");v.replaceChildren();viewItem(v,s,t);renderNav();}
function go(i){const t=T(cur.tid);if(i<0||i>=t.items.length)return;cur.i=i;S.lasti=i;save();render0()}
function resetTest(){stop();delete S.tests[cur.tid];save();cur.i=0;render()}
function finish(auto){
  const s=st(cur.tid),t=T(cur.tid);
  const empty=s.ans.filter(a=>a.some(x=>x===null)).length;
  if(!auto&&empty&&!confirm(empty+" item(s) are not fully built. Finish anyway? They count as missed."))return;
  stop();s.status="done";save();render();window.scrollTo(0,0);
}
function wordsDiff(it,arr){ // mark slots that differ from the key arrangement
  const out=[];let k=0;
  for(const [a,val] of it.tpl){
    if(a==="f"){out.push(h("span",{},val,"\u00a0"));continue}
    const si=k++,x=arr[si],want=it.ans[si];
    if(x===null)out.push(h("span",{class:"w x"},"(empty)"),"\u00a0");
    else if(x===want||it.tiles[x]===it.tiles[want])out.push(h("span",{class:"w"},it.tiles[x]),"\u00a0");
    else out.push(h("span",{class:"w "+(it.spare.includes(x)?"sp":"x")},it.tiles[x]),"\u00a0");
  }
  return out;
}
function viewReview(v,s,t){
  const sc=score(t.id);
  v.append(h("div",{class:"card"},h("div",{class:"score"},`${sc.r}/${sc.n}`),
    h("div",{class:"muted"},`Time ${fmt(s.elapsed)}${s.limit?" of "+fmt(s.limit):""} · ${s.date?new Date(s.date).toLocaleString():""}`),
    h("p",{class:"hint"},"Red words are tiles in the wrong slot. Yellow marks the spare tile that the answer does not use.")));
  t.items.forEach((it,i)=>{
    const arr=s.ans[i],ok=isRight(it,arr),sp=arr.filter(x=>x!==null&&it.spare.includes(x)).map(x=>it.tiles[x]);
    const card=h("div",{class:"card"});
    card.append(h("div",{class:"qhead"},h("span",{class:"qnum"},"Item "+it.n),
      !it.scored?h("span",{class:"tag skip"},"not scored"):h("span",{class:"tag "+(ok?"ok":"bad")},ok?"correct":"missed"),
      h("span",{class:"tag type"},it.type),it.embed?h("span",{class:"tag type"},"embedded / reported"):null,
      it.spare.length?h("span",{class:"tag type"},"has spare tile: "+it.spare.map(x=>it.tiles[x]).join(", ")):null,
      h("span",{},(s.t[i]||0)+" s")));
    if(it.flag)card.append(h("div",{class:"warn"},"Item flag: "+it.flag));
    card.append(h("div",{class:"ctx"},h("span",{class:"who"},"They say"),h("div",{},it.ctx)));
    card.append(h("div",{class:"yours "+(ok?"ok":"bad")},h("span",{class:"lbl"},"Your sentence"),wordsDiff(it,arr)));
    if(!ok)card.append(h("div",{class:"keyl"},h("span",{class:"lbl"},"Key"+(it.keyPrinted?" (corrected, see flag)":"")),it.key));
    if(!ok&&sp.length)card.append(h("div",{class:"hint"},"You used the spare tile: "+sp.join(", ")+". Suggested cause W1."));
    if(!ok&&it.scored){
      const sel=h("select",{onchange:e=>{s.cause[it.n]=e.target.value;save();document.getElementById("exportText").value=exportMd()}},CAUSES.map(([a,b])=>{const o=h("option",{value:a},b);if((s.cause[it.n]||"")===a)o.selected=true;return o}));
      const ta=h("textarea",{placeholder:"Why did this go wrong? Which tile or word did you misplace?",oninput:e=>{s.note[it.n]=e.target.value;save();document.getElementById("exportText").value=exportMd()}});ta.value=s.note[it.n]||"";
      card.append(h("div",{class:"fb"},h("span",{class:"lbl"},"Cause"),sel,ta));
    }
    v.append(card);
  });
}
function esc(x){return String(x||"").replace(/\|/g,"\\|").replace(/\n/g," ")}
function exportMd(){
  const L=["## Build a Sentence — exported "+new Date().toLocaleString(),"","| Test | Score | Time |","|---|---|---|"];
  const done=TESTS.filter(t=>st(t.id).status==="done");
  if(!done.length)return "Nothing checked yet.";
  let R=0,N=0;
  for(const t of done){const sc=score(t.id);R+=sc.r;N+=sc.n;L.push(`| ${t.name} | ${sc.r}/${sc.n} | ${fmt(st(t.id).elapsed)} |`)}
  L.push("",`Total: ${R}/${N}`,"","### Misses","","| Test | Item | They say | Your sentence | Key | Cause | Note |","|---|---|---|---|---|---|---|");
  for(const t of done){const s=st(t.id);t.items.forEach((it,i)=>{if(!it.scored||isRight(it,s.ans[i]))return;
    L.push(`| ${t.id} | Q${it.n} | ${esc(it.ctx)} | ${esc(compose(it,s.ans[i])||"(empty)")} | ${esc(it.key)} | ${esc(s.cause[it.n])} | ${esc(s.note[it.n])} |`)})}
  const fl=[];for(const t of done)t.items.forEach(it=>{if(it.flag)fl.push(`- ${t.id} Q${it.n}: ${it.flag}`)});
  if(fl.length)L.push("","### Item flags","",...fl);
  return L.join("\n");
}
document.getElementById("copyBtn").onclick=async()=>{const v=document.getElementById("exportText").value;try{await navigator.clipboard.writeText(v)}catch(e){document.getElementById("exportText").select();document.execCommand("copy")}};
document.addEventListener("keydown",e=>{
  if(["TEXTAREA","SELECT","INPUT"].includes(document.activeElement.tagName))return;
  const s=st(cur.tid);if(s.status!=="run")return;
  const arr=s.ans[cur.i];
  if(e.key==="ArrowRight")go(cur.i+1);
  else if(e.key==="ArrowLeft")go(cur.i-1);
  else if(e.key==="Backspace"){for(let k=arr.length-1;k>=0;k--)if(arr[k]!==null){arr[k]=null;break}save();render0();e.preventDefault()}
});
window.addEventListener("beforeunload",save);
render();if(st(cur.tid).status==="run")startTick();
</script></body></html>
